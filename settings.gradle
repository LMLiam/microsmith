import org.gradle.caching.http.HttpBuildCache

pluginManagement {
    includeBuild('build-logic')
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        mavenCentral()
        maven {
            url = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
            mavenContent {
                snapshotsOnly()
            }
        }
    }
}

buildCache {
    local {
        enabled = true
    }
    def remoteCacheUrl = providers.environmentVariable("GRADLE_HTTP_CACHE_URL").orNull
    if (remoteCacheUrl) {
        remote(HttpBuildCache) {
            url = uri(remoteCacheUrl)
            push = providers.environmentVariable("CI").isPresent()
            credentials {
                username = providers.environmentVariable("GRADLE_HTTP_CACHE_USERNAME").orNull
                password = providers.environmentVariable("GRADLE_HTTP_CACHE_PASSWORD").orNull
            }
            allowInsecureProtocol = false
        }
    }
}

rootProject.name = 'microsmith'

def moduleDirectories = []
file('modules').eachFileRecurse(groovy.io.FileType.FILES) { candidate ->
    if (candidate.name == 'build.gradle') {
        moduleDirectories << candidate.parentFile
    }
}
moduleDirectories = moduleDirectories.sort { it.path }

moduleDirectories.groupBy { it.name }.each { moduleName, directories ->
    if (directories.size() > 1) {
        throw new GradleException("Module name '${moduleName}' is used by several directories: ${directories*.path.join(', ')}")
    }
}

moduleDirectories.each { moduleDirectory ->
    include moduleDirectory.name
    project(":${moduleDirectory.name}").projectDir = moduleDirectory
}
