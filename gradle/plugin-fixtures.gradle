sourceSets {
    fixtureContract
    fixturePlugins {
        compileClasspath += sourceSets.fixtureContract.output
    }
}

def fixturePluginDirectory = layout.buildDirectory.dir('fixture-plugins')

def serviceInterfaceOf = { String fixtureName ->
    fixtureName.endsWith('Scripting')
            ? 'io.github.lmliam.microsmith.runtime.scripting.api.MicrosmithScriptingPlugin'
            : 'io.github.lmliam.microsmith.plugin.MicrosmithPlugin'
}

def fixtureNames = fileTree('src/fixturePlugins/kotlin/thirdparty/plugins') { include '*Plugin.kt' }
        .files
        .collect { it.name.replaceFirst(/Plugin\.kt$/, '') }
        .sort()

def fixturePluginJars = fixtureNames.collect { fixtureName ->
    def jarName = fixtureName.toLowerCase()
    tasks.register("${jarName}FixturePluginJar", Jar) {
        archiveFileName = "${jarName}.jar"
        destinationDirectory = fixturePluginDirectory
        from(sourceSets.fixturePlugins.output.classesDirs) {
            include "thirdparty/plugins/${fixtureName}Plugin*.class"
            include 'thirdparty/common/**'
        }
        from(resources.text.fromString("thirdparty.plugins.${fixtureName}Plugin").asFile('UTF-8')) {
            into 'META-INF/services'
            rename { serviceInterfaceOf(fixtureName) }
        }
    }
}

tasks.named('integrationTest') {
    dependsOn fixturePluginJars
    inputs.files(fixturePluginJars.collect { it.map { jar -> jar.archiveFile } })
    systemProperty 'microsmith.fixturePlugins', fixturePluginDirectory.get().asFile.absolutePath
}
