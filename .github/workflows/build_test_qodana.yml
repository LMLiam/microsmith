name: Build & Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
concurrency:
  group: build-qodana-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Publish native JVM packages to mavenLocal
        run: |
          ./gradlew \
            :dsl:publishToMavenLocal \
            :dsl-schemas:publishToMavenLocal \
            :dsl-schemas-protobuf:publishToMavenLocal \
            :dsl-schemas-protobuf-rpc:publishToMavenLocal \
            :gen:publishToMavenLocal \
            :gen-schemas:publishToMavenLocal \
            :gen-schemas-protobuf:publishToMavenLocal \
            :gen-schemas-protobuf-rpc:publishToMavenLocal \
            :runtime-scripting:publishToMavenLocal \
            :gradle-plugin:publishToMavenLocal \
            :maven-plugin:publishToMavenLocal \
            :sbt-plugin:publishToMavenLocal \
            --stacktrace
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Validate native Gradle fixtures
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)"
          validate_gradle_fixture() {
            local repo_root="$1"
            local generated_root="$repo_root/proto"

            ./gradlew -p "$repo_root" microsmithGenerate -PmicrosmithVersion="$VERSION" --stacktrace
            test -d "$generated_root"
            find "$generated_root" -maxdepth 1 -type f -name '*.proto' | grep -q .
          }

          validate_gradle_fixture examples/gradle/java
          validate_gradle_fixture examples/gradle/kotlin
          validate_gradle_fixture examples/gradle/scala
      - name: Validate native Maven fixtures
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)"

          validate_maven_fixture() {
            local repo_root="$1"
            local generated_root="$repo_root/proto"

            mvn -B -f "$repo_root/pom.xml" microsmith:generate -Dmicrosmith.version="$VERSION"
            test -d "$generated_root"
            find "$generated_root" -maxdepth 1 -type f -name '*.proto' | grep -q .
          }

          validate_maven_fixture examples/maven/java
          validate_maven_fixture examples/maven/kotlin
          validate_maven_fixture examples/maven/scala
      - name: Validate native sbt fixtures
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)"

          validate_sbt_fixture() {
            local repo_root="$1"
            local generated_root="$repo_root/proto"

            (cd "$repo_root" && sbt -batch -Dsbt.supershell=false -Dmicrosmith.version="$VERSION" microsmithGenerate)
            test -d "$generated_root"
            find "$generated_root" -maxdepth 1 -type f -name '*.proto' | grep -q .
          }

          validate_sbt_fixture examples/sbt/scala
      - name: Validate IDE fallback release assets
        run: |
          ./gradlew :runtime-scripting:ideFallbackArtifacts :runtime-scripting:generateIdeFallbackChecksums --stacktrace
          find modules/runtime-scripting/build/release-assets -maxdepth 1 -type f -name 'microscript-definition-*-all.jar' | grep -q .
          find modules/runtime-scripting/build/release-assets -maxdepth 1 -type f -name 'microscript-definition-*-all.jar.sha256' | grep -q .
      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: ${{ always() && hashFiles('**/build/test-results/**/*.xml') != '' }}
        with:
          name: JVM Test Results
          path: '**/build/test-results/**/*.xml'
          reporter: java-junit
      - name: 'Qodana Scan'
        if: ${{ env.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
      - uses: github/codeql-action/upload-sarif@v3
        name: Upload SARIF
        if: ${{ always() && env.QODANA_TOKEN != '' }}
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  cli-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build CLI release assets (Unix)
        id: build-release-unix
        if: runner.os != 'Windows'
        run: ./gradlew :cli:releaseArtifacts --stacktrace
      - name: Build CLI release assets (Windows)
        id: build-release-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :cli:releaseArtifacts --stacktrace
      - name: Smoke test dist launcher (Unix)
        if: runner.os != 'Windows'
        run: |
          ./modules/cli/build/microsmith-cli-dist/bin/microsmith --help > cli-help.txt
          grep -q "Usage:" cli-help.txt
      - name: Verify README CLI usage block (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/verify_readme_cli_usage.py README.md cli-help.txt
      - name: Smoke test dist generation and provider discovery (Unix)
        if: runner.os != 'Windows'
        run: |
          cat > schema.microsmith.kts <<'EOF'
          microsmith {
              schemas {
                  protobuf {
                      message("CiSmoke") {
                          int32("id") { index(1) }
                      }
                  }
              }
          }
          EOF
          ./modules/cli/build/microsmith-cli-dist/bin/microsmith run schema.microsmith.kts
          test -f proto/CiSmoke.proto
          ./modules/cli/build/microsmith-cli-dist/bin/microsmith run schema.microsmith.kts --isolation process
          test -f proto/CiSmoke.proto
      - name: Smoke test dist doctor diagnostics mode (Unix)
        if: runner.os != 'Windows'
        run: |
          ./modules/cli/build/microsmith-cli-dist/bin/microsmith doctor --diagnostics json > cli-doctor.json
          grep -q "Doctor checks passed." cli-doctor.json
      - name: Smoke test dist launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $help = & .\modules\cli\build\microsmith-cli-dist\bin\microsmith.bat --help 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $help
            exit $LASTEXITCODE
          }
          if (($help -join "`n") -notmatch "Usage:") {
            Write-Error "CLI help output did not contain expected Usage block."
            Write-Output $help
            exit 1
          }
      - name: Smoke test dist generation and provider discovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          microsmith {
              schemas {
                  protobuf {
                      message("CiSmoke") {
                          int32("id") { index(1) }
                      }
                  }
              }
          }
          '@ | Set-Content -Path schema.microsmith.kts -Encoding UTF8
          & .\modules\cli\build\microsmith-cli-dist\bin\microsmith.bat run schema.microsmith.kts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\proto\CiSmoke.proto)) {
            Write-Error "Expected proto\\CiSmoke.proto to exist."
            exit 1
          }
          & .\modules\cli\build\microsmith-cli-dist\bin\microsmith.bat run schema.microsmith.kts --out generated-process --isolation process
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\generated-process\proto\CiSmoke.proto)) {
            Write-Error "Expected generated-process\\proto\\CiSmoke.proto to exist."
            exit 1
          }
      - name: Smoke test dist doctor diagnostics mode (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $doctor = & .\modules\cli\build\microsmith-cli-dist\bin\microsmith.bat doctor --diagnostics json 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $doctor
            exit $LASTEXITCODE
          }
          if (($doctor -join "`n") -notmatch "Doctor checks passed.") {
            Write-Error "Doctor command output did not contain success marker."
            Write-Output $doctor
            exit 1
          }
      - name: Install and verify from installer (Unix)
        id: install-unix
        if: ${{ always() && runner.os != 'Windows' && steps.build-release-unix.outcome == 'success' }}
        run: |
          set -eu
          DIST_FILE="$(find modules/cli/build/release-assets -maxdepth 1 -type f -name 'microsmith-cli-*-dist.tar.gz' | head -n 1)"
          CLI_VERSION="$(printf '%s\n' "$DIST_FILE" | sed -E 's#.*microsmith-cli-(.*)-dist.tar.gz#\1#')"
          DIST_SHA="$(awk '{print $1}' "${DIST_FILE}.sha256")"
          sh modules/cli/build/release-assets/microsmith-install.sh \
            --version "$CLI_VERSION" \
            --install-root "$PWD/.microsmith-home" \
            --bin-dir "$PWD/.microsmith-bin" \
            --dist-file "$DIST_FILE" \
            --dist-sha256 "$DIST_SHA" \
            --force-runtime-provision \
            --no-profile-update
          ./.microsmith-bin/microsmith --version
          mkdir -p install-smoke-repo
          ./.microsmith-bin/microsmith init --repo-root install-smoke-repo
          test -f install-smoke-repo/build.microsmith.kts
          test -f install-smoke-repo/settings.microsmith.kts
          ./.microsmith-bin/microsmith run install-smoke-repo/build.microsmith.kts
            test -f proto/UserCreated.proto
      - name: Smoke test Java, Kotlin, Scala, Node, Go, Python, Ruby, and Rust onboarding fixtures (Linux)
        if: ${{ always() && matrix.os == 'ubuntu-latest' && steps.install-unix.outcome == 'success' }}
        run: |
          set -euo pipefail
          smoke_unix_fixture() {
            local repo_name="$1"
            local repo_root="$2"
            local expected_proto="$3"
            local doctor_output="$4"

            ./.microsmith-bin/microsmith init --repo-root "$repo_root"
            ./.microsmith-bin/microsmith init --repo-root "$repo_root"
            test -f "$repo_root/build.microsmith.kts"
            test -f "$repo_root/settings.microsmith.kts"
            test -f "$repo_root/.microsmith/ide/build.gradle.kts"
            test -f "$repo_root/.microsmith/ide/README.md"
            ./.microsmith-bin/microsmith ide refresh --repo-root "$repo_root"
            ./.microsmith-bin/microsmith ide doctor --repo-root "$repo_root" --diagnostics json > "$doctor_output"
            grep -q "JetBrains IDE helper doctor checks passed." "$doctor_output"
            ./.microsmith-bin/microsmith run "$repo_root/build.microsmith.kts"
            test -f "$repo_root/proto/$expected_proto"
            echo "Validated $repo_name fixture."
          }

          smoke_unix_fixture java examples/jvm/java-maven JavaUserCreated.proto java-ide-doctor.json
          smoke_unix_fixture kotlin examples/jvm/kotlin-gradle KotlinUserCreated.proto kotlin-ide-doctor.json
          smoke_unix_fixture scala examples/jvm/scala-sbt ScalaUserCreated.proto scala-ide-doctor.json
          smoke_unix_fixture node examples/non-gradle/node NodeUserCreated.proto node-ide-doctor.json
          smoke_unix_fixture go examples/non-gradle/go GoUserCreated.proto go-ide-doctor.json
          smoke_unix_fixture python examples/non-gradle/python PythonUserCreated.proto python-ide-doctor.json
          smoke_unix_fixture ruby examples/non-gradle/ruby RubyUserCreated.proto ruby-ide-doctor.json
          smoke_unix_fixture rust examples/non-gradle/rust RustUserCreated.proto rust-ide-doctor.json
      - name: Install and verify from installer (Windows)
        id: install-windows
        if: ${{ always() && runner.os == 'Windows' && steps.build-release-windows.outcome == 'success' }}
        shell: pwsh
        run: |
          $distAsset = Get-ChildItem -Path .\modules\cli\build\release-assets\microsmith-cli-*-dist.zip | Select-Object -First 1
          if (-not $distAsset) {
            Write-Error "Unable to locate CLI dist zip asset."
            exit 1
          }
          $version = [regex]::Match($distAsset.Name, 'microsmith-cli-(.+)-dist\.zip').Groups[1].Value
          $distShaPath = "$($distAsset.FullName).sha256"
          if (-not (Test-Path $distShaPath)) {
            Write-Error "Missing dist checksum file: $distShaPath"
            exit 1
          }
          $distSha = (Get-Content -Path $distShaPath -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          & .\modules\cli\build\release-assets\microsmith-install.ps1 `
            -Version $version `
            -InstallRoot "$pwd\.microsmith-home" `
            -BinDir "$pwd\.microsmith-bin" `
            -DistFile $distAsset.FullName `
            -DistSha256 $distSha `
            -ForceRuntimeProvision `
            -NoProfileUpdate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & .\.microsmith-bin\microsmith.cmd --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          New-Item -ItemType Directory -Path install-smoke-repo -Force | Out-Null
          & .\.microsmith-bin\microsmith.cmd init --repo-root install-smoke-repo
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\install-smoke-repo\build.microsmith.kts)) {
            Write-Error "Expected build.microsmith.kts to exist after init."
            exit 1
          }
          if (-not (Test-Path .\install-smoke-repo\settings.microsmith.kts)) {
            Write-Error "Expected settings.microsmith.kts to exist after init."
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd run install-smoke-repo\build.microsmith.kts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\proto\UserCreated.proto)) {
            Write-Error "Expected proto\\UserCreated.proto to exist after run."
            exit 1
          }
      - name: Smoke test .NET onboarding fixture (Windows)
        if: ${{ always() && matrix.os == 'windows-latest' && steps.install-windows.outcome == 'success' }}
        shell: pwsh
        run: |
          & .\.microsmith-bin\microsmith.cmd init --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & .\.microsmith-bin\microsmith.cmd init --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\build.microsmith.kts)) {
            Write-Error "Expected build.microsmith.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\settings.microsmith.kts)) {
            Write-Error "Expected settings.microsmith.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\.microsmith\ide\build.gradle.kts)) {
            Write-Error "Expected IDE helper build.gradle.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\.microsmith\ide\README.md)) {
            Write-Error "Expected IDE helper README.md to exist for the .NET fixture."
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd ide refresh --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $ideDoctor = & .\.microsmith-bin\microsmith.cmd ide doctor --repo-root examples/non-gradle/dotnet --diagnostics json 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $ideDoctor
            exit $LASTEXITCODE
          }
          if (($ideDoctor -join "`n") -notmatch "JetBrains IDE helper doctor checks passed.") {
            Write-Error "IDE helper doctor did not report success for the .NET fixture."
            Write-Output $ideDoctor
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd run examples/non-gradle/dotnet/build.microsmith.kts --out examples/non-gradle/dotnet/Generated
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\Generated\proto\DotnetUserCreated.proto)) {
            Write-Error "Expected Generated\\proto\\DotnetUserCreated.proto to exist for the .NET fixture."
            exit 1
          }
