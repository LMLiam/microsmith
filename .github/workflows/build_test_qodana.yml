name: Build & Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
concurrency:
  group: build-qodana-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: ${{ always() && hashFiles('**/build/test-results/jvmKotest/*.xml') != '' }}
        with:
          name: Kotest Results
          path: '**/build/test-results/jvmKotest/*.xml'
          reporter: java-junit
      - name: 'Qodana Scan'
        if: ${{ env.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
      - uses: github/codeql-action/upload-sarif@v3
        name: Upload SARIF
        if: ${{ always() && env.QODANA_TOKEN != '' }}
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  cli-dist-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build CLI distribution artifacts (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew :cli:distArtifacts --stacktrace
      - name: Build CLI distribution artifacts (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :cli:distArtifacts --stacktrace
      - name: Smoke test launcher (Unix)
        if: runner.os != 'Windows'
        run: |
          ./cli/build/microsmith-cli-dist/bin/microsmith --help > cli-help.txt
          grep -q "Usage:" cli-help.txt
      - name: Smoke test launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $help = & .\cli\build\microsmith-cli-dist\bin\microsmith.bat --help 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $help
            exit $LASTEXITCODE
          }
          if (($help -join "`n") -notmatch "Usage:") {
            Write-Error "CLI help output did not contain expected Usage block."
            Write-Output $help
            exit 1
          }
