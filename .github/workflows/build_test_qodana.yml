name: Build & Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '17 3 * * 1,4'
concurrency:
  group: build-qodana-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
permissions:
  contents: read
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        uses: dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Run detekt and ktfmt
        run: ./gradlew detektMain detektTest detektIntegrationTest detektE2eTest ktfmtCheck --stacktrace
      - name: Verify public ABI
        run: ./gradlew checkKotlinAbi --stacktrace

  unit-tests:
    name: Unit tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Run unit tests
        run: ./gradlew kotest :build-logic:test --stacktrace
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 3

  integration-tests:
    name: Integration tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Run integration tests
        run: ./gradlew integrationTest --stacktrace
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-integration
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 3

  e2e-tests:
    name: End-to-end tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Run end-to-end tests
        run: ./gradlew e2eTest --stacktrace
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
          retention-days: 3

  gradle-fixtures:
    name: Native Gradle fixtures
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Publish native JVM packages to mavenLocal
        run: ./gradlew publishToMavenLocal --stacktrace
      - name: Validate native Gradle fixtures
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)"
          validate_gradle_proto_fixture() {
            local repo_root="$1"
            local generated_root="$repo_root/proto"

            ./gradlew -p "$repo_root" microsmithGenerate -PmicrosmithVersion="$VERSION" --stacktrace
            test -d "$generated_root"
            find "$generated_root" -maxdepth 1 -type f -name '*.proto' | grep -q .
          }

          validate_gradle_dotnet_fixture() {
            local repo_root="$1"
            local project_root="$repo_root/Generated/dotnet/Platform/UserService.Api"

            ./gradlew -p "$repo_root" microsmithGenerate -PmicrosmithVersion="$VERSION" --stacktrace
            test -f "$project_root/UserService.Api.csproj"
            test -f "$project_root/Generated/Controllers/UserServiceApiControllerBase.cs"
            test -f "$project_root/Generated/Contracts/ResponseModels.cs"
            dotnet build "$project_root/UserService.Api.csproj"
          }

          validate_gradle_proto_fixture examples/gradle/java
          validate_gradle_proto_fixture examples/gradle/kotlin
          validate_gradle_dotnet_fixture examples/gradle/dotnet

  maven-fixtures:
    name: Native Maven fixtures
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/io/github/lmliam
          key: maven-fixtures-${{ runner.os }}-${{ hashFiles('examples/maven/**/pom.xml') }}
          restore-keys: |
            maven-fixtures-${{ runner.os }}-
      - name: Publish native JVM packages to mavenLocal
        run: ./gradlew publishToMavenLocal --stacktrace
      - name: Validate native Maven fixtures
        run: |
          set -euo pipefail
          VERSION="$(./gradlew -q properties | sed -n 's/^version: //p' | head -n 1)"

          validate_maven_proto_fixture() {
            local repo_root="$1"
            local output_root="$repo_root/target/generated/microsmith"
            local generated_root="$output_root/proto"

            mvn -B -f "$repo_root/pom.xml" microsmith:generate -Dmicrosmith.version="$VERSION"
            test -d "$generated_root"
            find "$generated_root" -maxdepth 1 -type f -name '*.proto' | grep -q .
          }

          validate_maven_dotnet_fixture() {
            local repo_root="$1"
            local project_root="$repo_root/Generated/dotnet/Platform/UserService.Api"

            mvn -B -f "$repo_root/pom.xml" microsmith:generate -Dmicrosmith.version="$VERSION"
            test -f "$project_root/UserService.Api.csproj"
            test -f "$project_root/Generated/Controllers/UserServiceApiControllerBase.cs"
            test -f "$project_root/Generated/Contracts/ResponseModels.cs"
            dotnet build "$project_root/UserService.Api.csproj"
          }

          validate_maven_proto_fixture examples/maven/java
          validate_maven_proto_fixture examples/maven/kotlin
          validate_maven_dotnet_fixture examples/maven/dotnet

  cli-dist:
    name: CLI distribution
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Build CLI release assets
        run: ./gradlew :cli:releaseArtifacts :runtime-scripting:ideFallbackArtifacts :runtime-scripting:generateIdeFallbackChecksums --stacktrace
      - name: Validate IDE fallback release assets
        run: |
          find modules/runtime/runtime-scripting/build/release-assets -maxdepth 1 -type f -name 'microscript-definition-*-all.jar' | grep -q .
          find modules/runtime/runtime-scripting/build/release-assets -maxdepth 1 -type f -name 'microscript-definition-*-all.jar.sha256' | grep -q .
      - name: Archive CLI distribution
        run: tar -czf cli-dist.tgz modules/integrations/cli/build/microsmith-cli-dist modules/integrations/cli/build/release-assets
      - name: Upload CLI distribution
        uses: actions/upload-artifact@v7
        with:
          name: cli-dist
          path: cli-dist.tgz
          compression-level: 0
          retention-days: 3

  cli-verify:
    name: CLI verification (${{ matrix.os }})
    needs: cli-dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Download CLI distribution
        uses: actions/download-artifact@v8
        with:
          name: cli-dist
      - name: Extract CLI distribution
        id: extract-dist
        shell: bash
        run: tar -xzf cli-dist.tgz
      - name: Verify dist launcher (Unix)
        if: runner.os != 'Windows'
        run: ./modules/integrations/cli/build/microsmith-cli-dist/bin/microsmith --help | grep -q "Usage:"
      - name: Verify dist generation and provider discovery (Unix)
        if: runner.os != 'Windows'
        run: |
          cat > schema.microsmith.kts <<'EOF'
          microsmith {
              schemas {
                  protobuf {
                      message("CiSmoke") {
                          int32("id") { index(1) }
                      }
                  }
              }
          }
          EOF
          ./modules/integrations/cli/build/microsmith-cli-dist/bin/microsmith run schema.microsmith.kts
          test -f proto/CiSmoke.proto
          ./modules/integrations/cli/build/microsmith-cli-dist/bin/microsmith run schema.microsmith.kts --isolation process
          test -f proto/CiSmoke.proto
      - name: Verify dist ASP.NET generation (Unix)
        if: runner.os != 'Windows'
        run: |
          ./modules/integrations/cli/build/microsmith-cli-dist/bin/microsmith run examples/non-gradle/dotnet/schema.microsmith.kts --out aspnet-dist
          test -f aspnet-dist/dotnet/Platform/UserService.Api/UserService.Api.csproj
          test -f aspnet-dist/dotnet/Platform/UserService.Api/Generated/Controllers/UserServiceApiControllerBase.cs
          test -f aspnet-dist/dotnet/Platform/UserService.Api/Generated/Contracts/ResponseModels.cs
          dotnet build aspnet-dist/dotnet/Platform/UserService.Api/UserService.Api.csproj
      - name: Verify dist doctor diagnostics mode (Unix)
        if: runner.os != 'Windows'
        run: |
          ./modules/integrations/cli/build/microsmith-cli-dist/bin/microsmith doctor --diagnostics json > cli-doctor.json
          grep -q "Doctor checks passed." cli-doctor.json
      - name: Verify dist launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $help = & .\modules\integrations\cli\build\microsmith-cli-dist\bin\microsmith.bat --help 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $help
            exit $LASTEXITCODE
          }
          if (($help -join "`n") -notmatch "Usage:") {
            Write-Error "CLI help output did not contain expected Usage block."
            Write-Output $help
            exit 1
          }
      - name: Verify dist generation and provider discovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          microsmith {
              schemas {
                  protobuf {
                      message("CiSmoke") {
                          int32("id") { index(1) }
                      }
                  }
              }
          }
          '@ | Set-Content -Path schema.microsmith.kts -Encoding UTF8
          & .\modules\integrations\cli\build\microsmith-cli-dist\bin\microsmith.bat run schema.microsmith.kts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\proto\CiSmoke.proto)) {
            Write-Error "Expected proto\\CiSmoke.proto to exist."
            exit 1
          }
          & .\modules\integrations\cli\build\microsmith-cli-dist\bin\microsmith.bat run schema.microsmith.kts --out generated-process --isolation process
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\generated-process\proto\CiSmoke.proto)) {
            Write-Error "Expected generated-process\\proto\\CiSmoke.proto to exist."
            exit 1
          }
      - name: Verify dist ASP.NET generation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\modules\integrations\cli\build\microsmith-cli-dist\bin\microsmith.bat run examples/non-gradle/dotnet\schema.microsmith.kts --out aspnet-dist
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $projectRoot = ".\aspnet-dist\dotnet\Platform\UserService.Api"
          if (-not (Test-Path "$projectRoot\UserService.Api.csproj")) {
            Write-Error "Expected aspnet-dist\\dotnet\\Platform\\UserService.Api\\UserService.Api.csproj to exist."
            exit 1
          }
          if (-not (Test-Path "$projectRoot\Generated\Controllers\UserServiceApiControllerBase.cs")) {
            Write-Error "Expected aspnet-dist\\dotnet\\Platform\\UserService.Api\\Generated\\Controllers\\UserServiceApiControllerBase.cs to exist."
            exit 1
          }
          if (-not (Test-Path "$projectRoot\Generated\Contracts\ResponseModels.cs")) {
            Write-Error "Expected aspnet-dist\\dotnet\\Platform\\UserService.Api\\Generated\\Contracts\\ResponseModels.cs to exist."
            exit 1
          }
          dotnet build "$projectRoot\UserService.Api.csproj"
      - name: Verify dist doctor diagnostics mode (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $doctor = & .\modules\integrations\cli\build\microsmith-cli-dist\bin\microsmith.bat doctor --diagnostics json 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $doctor
            exit $LASTEXITCODE
          }
          if (($doctor -join "`n") -notmatch "Doctor checks passed.") {
            Write-Error "Doctor command output did not contain success marker."
            Write-Output $doctor
            exit 1
          }
      - name: Install and verify from installer (Unix)
        id: install-unix
        if: ${{ always() && runner.os != 'Windows' && steps.extract-dist.outcome == 'success' }}
        run: |
          set -eu
          DIST_FILE="$(find modules/integrations/cli/build/release-assets -maxdepth 1 -type f -name 'microsmith-cli-*-dist.tar.gz' | head -n 1)"
          CLI_VERSION="$(printf '%s\n' "$DIST_FILE" | sed -E 's#.*microsmith-cli-(.*)-dist.tar.gz#\1#')"
          DIST_SHA="$(awk '{print $1}' "${DIST_FILE}.sha256")"
          sh modules/integrations/cli/build/release-assets/microsmith-install.sh \
            --version "$CLI_VERSION" \
            --install-root "$PWD/.microsmith-home" \
            --bin-dir "$PWD/.microsmith-bin" \
            --dist-file "$DIST_FILE" \
            --dist-sha256 "$DIST_SHA" \
            --force-runtime-provision \
            --no-profile-update
          ./.microsmith-bin/microsmith --version
          mkdir -p install-smoke-repo
          ./.microsmith-bin/microsmith init --repo-root install-smoke-repo
          test -f install-smoke-repo/build.microsmith.kts
          test -f install-smoke-repo/settings.microsmith.kts
          ./.microsmith-bin/microsmith run install-smoke-repo/build.microsmith.kts
          test -f proto/UserCreated.proto
      - name: Verify .NET onboarding fixture (Unix)
        if: ${{ always() && runner.os != 'Windows' && steps.install-unix.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./.microsmith-bin/microsmith init --repo-root examples/non-gradle/dotnet
          ./.microsmith-bin/microsmith init --repo-root examples/non-gradle/dotnet
          test -f examples/non-gradle/dotnet/build.microsmith.kts
          test -f examples/non-gradle/dotnet/settings.microsmith.kts
          test -f examples/non-gradle/dotnet/.microsmith/ide/build.gradle.kts
          test -f examples/non-gradle/dotnet/.microsmith/ide/README.md
          ./.microsmith-bin/microsmith ide refresh --repo-root examples/non-gradle/dotnet
          ./.microsmith-bin/microsmith ide doctor --repo-root examples/non-gradle/dotnet --diagnostics json > dotnet-ide-doctor.json
          grep -q "JetBrains IDE helper doctor checks passed." dotnet-ide-doctor.json
          ./.microsmith-bin/microsmith run examples/non-gradle/dotnet/build.microsmith.kts --out examples/non-gradle/dotnet/Generated
          project_root="examples/non-gradle/dotnet/Generated/dotnet/Platform/UserService.Api"
          test -f "$project_root/UserService.Api.csproj"
          test -f "$project_root/Generated/Controllers/UserServiceApiControllerBase.cs"
          test -f "$project_root/Generated/Contracts/ResponseModels.cs"
          dotnet build "$project_root/UserService.Api.csproj"
      - name: Install and verify from installer (Windows)
        id: install-windows
        if: ${{ always() && runner.os == 'Windows' && steps.extract-dist.outcome == 'success' }}
        shell: pwsh
        run: |
          $distAsset = Get-ChildItem -Path .\modules\integrations\cli\build\release-assets\microsmith-cli-*-dist.zip | Select-Object -First 1
          if (-not $distAsset) {
            Write-Error "Unable to locate CLI dist zip asset."
            exit 1
          }
          $version = [regex]::Match($distAsset.Name, 'microsmith-cli-(.+)-dist\.zip').Groups[1].Value
          $distShaPath = "$($distAsset.FullName).sha256"
          if (-not (Test-Path $distShaPath)) {
            Write-Error "Missing dist checksum file: $distShaPath"
            exit 1
          }
          $distSha = (Get-Content -Path $distShaPath -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          & .\modules\integrations\cli\build\release-assets\microsmith-install.ps1 `
            -Version $version `
            -InstallRoot "$pwd\.microsmith-home" `
            -BinDir "$pwd\.microsmith-bin" `
            -DistFile $distAsset.FullName `
            -DistSha256 $distSha `
            -ForceRuntimeProvision `
            -NoProfileUpdate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & .\.microsmith-bin\microsmith.cmd --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          New-Item -ItemType Directory -Path install-smoke-repo -Force | Out-Null
          & .\.microsmith-bin\microsmith.cmd init --repo-root install-smoke-repo
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\install-smoke-repo\build.microsmith.kts)) {
            Write-Error "Expected build.microsmith.kts to exist after init."
            exit 1
          }
          if (-not (Test-Path .\install-smoke-repo\settings.microsmith.kts)) {
            Write-Error "Expected settings.microsmith.kts to exist after init."
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd run install-smoke-repo\build.microsmith.kts
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\proto\UserCreated.proto)) {
            Write-Error "Expected proto\\UserCreated.proto to exist after run."
            exit 1
          }
      - name: Verify .NET onboarding fixture (Windows)
        if: ${{ always() && matrix.os == 'windows-latest' && steps.install-windows.outcome == 'success' }}
        shell: pwsh
        run: |
          & .\.microsmith-bin\microsmith.cmd init --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & .\.microsmith-bin\microsmith.cmd init --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\build.microsmith.kts)) {
            Write-Error "Expected build.microsmith.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\settings.microsmith.kts)) {
            Write-Error "Expected settings.microsmith.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\.microsmith\ide\build.gradle.kts)) {
            Write-Error "Expected IDE helper build.gradle.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\.microsmith\ide\README.md)) {
            Write-Error "Expected IDE helper README.md to exist for the .NET fixture."
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd ide refresh --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $ideDoctor = & .\.microsmith-bin\microsmith.cmd ide doctor --repo-root examples/non-gradle/dotnet --diagnostics json 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $ideDoctor
            exit $LASTEXITCODE
          }
          if (($ideDoctor -join "`n") -notmatch "JetBrains IDE helper doctor checks passed.") {
            Write-Error "IDE helper doctor did not report success for the .NET fixture."
            Write-Output $ideDoctor
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd run examples/non-gradle/dotnet/build.microsmith.kts --out examples/non-gradle/dotnet/Generated
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $projectRoot = ".\examples\non-gradle\dotnet\Generated\dotnet\Platform\UserService.Api"
          if (-not (Test-Path "$projectRoot\UserService.Api.csproj")) {
            Write-Error "Expected Generated\\dotnet\\Platform\\UserService.Api\\UserService.Api.csproj to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path "$projectRoot\Generated\Controllers\UserServiceApiControllerBase.cs")) {
            Write-Error "Expected Generated\\dotnet\\Platform\\UserService.Api\\Generated\\Controllers\\UserServiceApiControllerBase.cs to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path "$projectRoot\Generated\Contracts\ResponseModels.cs")) {
            Write-Error "Expected Generated\\dotnet\\Platform\\UserService.Api\\Generated\\Contracts\\ResponseModels.cs to exist for the .NET fixture."
            exit 1
          }
          dotnet build "$projectRoot\UserService.Api.csproj"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  cli-onboarding:
    name: CLI onboarding fixtures (Linux)
    needs: cli-dist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Download CLI distribution
        uses: actions/download-artifact@v8
        with:
          name: cli-dist
      - name: Extract CLI distribution
        id: extract-dist
        shell: bash
        run: tar -xzf cli-dist.tgz
      - name: Install and verify from installer (Unix)
        id: install-unix
        if: ${{ steps.extract-dist.outcome == 'success' }}
        run: |
          set -eu
          DIST_FILE="$(find modules/integrations/cli/build/release-assets -maxdepth 1 -type f -name 'microsmith-cli-*-dist.tar.gz' | head -n 1)"
          CLI_VERSION="$(printf '%s\n' "$DIST_FILE" | sed -E 's#.*microsmith-cli-(.*)-dist.tar.gz#\1#')"
          DIST_SHA="$(awk '{print $1}' "${DIST_FILE}.sha256")"
          sh modules/integrations/cli/build/release-assets/microsmith-install.sh \
            --version "$CLI_VERSION" \
            --install-root "$PWD/.microsmith-home" \
            --bin-dir "$PWD/.microsmith-bin" \
            --dist-file "$DIST_FILE" \
            --dist-sha256 "$DIST_SHA" \
            --force-runtime-provision \
            --no-profile-update
          ./.microsmith-bin/microsmith --version
          mkdir -p install-smoke-repo
          ./.microsmith-bin/microsmith init --repo-root install-smoke-repo
          test -f install-smoke-repo/build.microsmith.kts
          test -f install-smoke-repo/settings.microsmith.kts
          ./.microsmith-bin/microsmith run install-smoke-repo/build.microsmith.kts
          test -f proto/UserCreated.proto
      - name: Verify Java, Kotlin, Node, Go, Python, Ruby, and Rust onboarding fixtures (Linux)
        if: ${{ always() && steps.install-unix.outcome == 'success' }}
        run: |
          set -euo pipefail
          verify_unix_fixture() {
            local repo_name="$1"
            local repo_root="$2"
            local expected_proto="$3"
            local doctor_output="$4"

            ./.microsmith-bin/microsmith init --repo-root "$repo_root"
            ./.microsmith-bin/microsmith init --repo-root "$repo_root"
            test -f "$repo_root/build.microsmith.kts"
            test -f "$repo_root/settings.microsmith.kts"
            test -f "$repo_root/.microsmith/ide/build.gradle.kts"
            test -f "$repo_root/.microsmith/ide/README.md"
            ./.microsmith-bin/microsmith ide refresh --repo-root "$repo_root"
            ./.microsmith-bin/microsmith ide doctor --repo-root "$repo_root" --diagnostics json > "$doctor_output"
            grep -q "JetBrains IDE helper doctor checks passed." "$doctor_output"
            ./.microsmith-bin/microsmith run "$repo_root/build.microsmith.kts"
            test -f "proto/$expected_proto"
            echo "Validated $repo_name fixture."
          }

          verify_unix_fixture java examples/jvm/java-maven JavaUserCreated.proto java-ide-doctor.json
          verify_unix_fixture kotlin examples/gradle/kotlin KotlinUserCreated.proto kotlin-ide-doctor.json
          verify_unix_fixture node examples/non-gradle/node NodeUserCreated.proto node-ide-doctor.json
          verify_unix_fixture go examples/non-gradle/go GoUserCreated.proto go-ide-doctor.json
          verify_unix_fixture python examples/non-gradle/python PythonUserCreated.proto python-ide-doctor.json
          verify_unix_fixture ruby examples/non-gradle/ruby RubyUserCreated.proto ruby-ide-doctor.json
          verify_unix_fixture rust examples/non-gradle/rust RustUserCreated.proto rust-ide-doctor.json

  qodana:
    name: Qodana
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Qodana Scan
        if: ${{ env.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
      - uses: github/codeql-action/upload-sarif@v4
        name: Upload SARIF
        if: ${{ always() && env.QODANA_TOKEN != '' }}
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  report:
    name: Test report
    needs:
      - unit-tests
      - integration-tests
      - e2e-tests
    if: ${{ always() && needs.unit-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true
      - name: Publish Test Report
        if: ${{ hashFiles('**/build/test-results/**/*.xml') != '' }}
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: JVM Test Results
          path: '**/build/test-results/**/*.xml'
          reporter: java-junit
          fail-on-error: false

  ci-ok:
    name: CI result
    needs:
      - changes
      - lint
      - unit-tests
      - integration-tests
      - e2e-tests
      - gradle-fixtures
      - maven-fixtures
      - cli-dist
      - cli-verify
      - cli-onboarding
      - qodana
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or be skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
