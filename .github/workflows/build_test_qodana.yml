name: Build & Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
concurrency:
  group: build-qodana-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Validate IDE fallback release assets
        run: |
          ./gradlew :runtime-scripting:ideFallbackArtifacts :runtime-scripting:generateIdeFallbackChecksums --stacktrace
          find runtime-scripting/build/release-assets -maxdepth 1 -type f -name 'microsmith-script-definition-*-all.jar' | grep -q .
          find runtime-scripting/build/release-assets -maxdepth 1 -type f -name 'microsmith-script-definition-*-all.jar.sha256' | grep -q .
      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: ${{ always() && hashFiles('**/build/test-results/jvmKotest/*.xml') != '' }}
        with:
          name: Kotest Results
          path: '**/build/test-results/jvmKotest/*.xml'
          reporter: java-junit
      - name: 'Qodana Scan'
        if: ${{ env.QODANA_TOKEN != '' }}
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
      - uses: github/codeql-action/upload-sarif@v3
        name: Upload SARIF
        if: ${{ always() && env.QODANA_TOKEN != '' }}
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  cli-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build CLI release assets (Unix)
        id: build-release-unix
        if: runner.os != 'Windows'
        run: ./gradlew :cli:releaseArtifacts --stacktrace
      - name: Build CLI release assets (Windows)
        id: build-release-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat :cli:releaseArtifacts --stacktrace
      - name: Smoke test dist launcher (Unix)
        if: runner.os != 'Windows'
        run: |
          ./cli/build/microsmith-cli-dist/bin/microsmith --help > cli-help.txt
          grep -q "Usage:" cli-help.txt
      - name: Verify README CLI usage block (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/verify_readme_cli_usage.py README.md cli-help.txt
      - name: Smoke test dist generation and provider discovery (Unix)
        if: runner.os != 'Windows'
        run: |
          cat > schema.microsmith.kts <<'EOF'
          microsmith {
              schemas {
                  protobuf {
                      message("CiSmoke") {
                          int32("id") { index(1) }
                      }
                  }
              }
          }
          EOF
          ./cli/build/microsmith-cli-dist/bin/microsmith run schema.microsmith.kts --out generated
          test -f generated/proto/CiSmoke.proto
          ./cli/build/microsmith-cli-dist/bin/microsmith run schema.microsmith.kts --out generated-process --isolation process
          test -f generated-process/proto/CiSmoke.proto
      - name: Smoke test dist doctor diagnostics mode (Unix)
        if: runner.os != 'Windows'
        run: |
          ./cli/build/microsmith-cli-dist/bin/microsmith doctor --diagnostics json > cli-doctor.json
          grep -q "Doctor checks passed." cli-doctor.json
      - name: Smoke test dist launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $help = & .\cli\build\microsmith-cli-dist\bin\microsmith.bat --help 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $help
            exit $LASTEXITCODE
          }
          if (($help -join "`n") -notmatch "Usage:") {
            Write-Error "CLI help output did not contain expected Usage block."
            Write-Output $help
            exit 1
          }
      - name: Smoke test dist generation and provider discovery (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          microsmith {
              schemas {
                  protobuf {
                      message("CiSmoke") {
                          int32("id") { index(1) }
                      }
                  }
              }
          }
          '@ | Set-Content -Path schema.microsmith.kts -Encoding UTF8
          & .\cli\build\microsmith-cli-dist\bin\microsmith.bat run schema.microsmith.kts --out generated
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\generated\proto\CiSmoke.proto)) {
            Write-Error "Expected generated\\proto\\CiSmoke.proto to exist."
            exit 1
          }
          & .\cli\build\microsmith-cli-dist\bin\microsmith.bat run schema.microsmith.kts --out generated-process --isolation process
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\generated-process\proto\CiSmoke.proto)) {
            Write-Error "Expected generated-process\\proto\\CiSmoke.proto to exist."
            exit 1
          }
      - name: Smoke test dist doctor diagnostics mode (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $doctor = & .\cli\build\microsmith-cli-dist\bin\microsmith.bat doctor --diagnostics json 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $doctor
            exit $LASTEXITCODE
          }
          if (($doctor -join "`n") -notmatch "Doctor checks passed.") {
            Write-Error "Doctor command output did not contain success marker."
            Write-Output $doctor
            exit 1
          }
      - name: Install and verify from installer (Unix)
        id: install-unix
        if: ${{ always() && runner.os != 'Windows' && steps.build-release-unix.outcome == 'success' }}
        run: |
          set -eu
          DIST_FILE="$(find cli/build/release-assets -maxdepth 1 -type f -name 'microsmith-cli-*-dist.tar.gz' | head -n 1)"
          CLI_VERSION="$(printf '%s\n' "$DIST_FILE" | sed -E 's#.*microsmith-cli-(.*)-dist.tar.gz#\1#')"
          DIST_SHA="$(awk '{print $1}' "${DIST_FILE}.sha256")"
          sh cli/build/release-assets/microsmith-install.sh \
            --version "$CLI_VERSION" \
            --install-root "$PWD/.microsmith-home" \
            --bin-dir "$PWD/.microsmith-bin" \
            --dist-file "$DIST_FILE" \
            --dist-sha256 "$DIST_SHA" \
            --force-runtime-provision \
            --no-profile-update
          ./.microsmith-bin/microsmith --version
          mkdir -p install-smoke-repo
          ./.microsmith-bin/microsmith init --repo-root install-smoke-repo
          test -f install-smoke-repo/build.microsmith.kts
          test -f install-smoke-repo/settings.microsmith.kts
          ./.microsmith-bin/microsmith run install-smoke-repo/build.microsmith.kts --out install-smoke-repo/generated
          test -f install-smoke-repo/generated/proto/UserCreated.proto
      - name: Smoke test Node and Go onboarding fixtures (Linux)
        if: ${{ always() && matrix.os == 'ubuntu-latest' && steps.install-unix.outcome == 'success' }}
        run: |
          set -eu
          ./.microsmith-bin/microsmith init --repo-root examples/non-gradle/node
          ./.microsmith-bin/microsmith init --repo-root examples/non-gradle/node
          test -f examples/non-gradle/node/build.microsmith.kts
          test -f examples/non-gradle/node/settings.microsmith.kts
          test -f examples/non-gradle/node/.microsmith/ide/build.gradle.kts
          test -f examples/non-gradle/node/.microsmith/ide/README.md
          ./.microsmith-bin/microsmith ide refresh --repo-root examples/non-gradle/node
          ./.microsmith-bin/microsmith ide doctor --repo-root examples/non-gradle/node --diagnostics json > node-ide-doctor.json
          grep -q "JetBrains IDE helper doctor checks passed." node-ide-doctor.json
          ./.microsmith-bin/microsmith run examples/non-gradle/node/build.microsmith.kts --out examples/non-gradle/node/generated
          test -f examples/non-gradle/node/generated/proto/NodeUserCreated.proto
          ./.microsmith-bin/microsmith init --repo-root examples/non-gradle/go
          ./.microsmith-bin/microsmith init --repo-root examples/non-gradle/go
          test -f examples/non-gradle/go/build.microsmith.kts
          test -f examples/non-gradle/go/settings.microsmith.kts
          test -f examples/non-gradle/go/.microsmith/ide/build.gradle.kts
          test -f examples/non-gradle/go/.microsmith/ide/README.md
          ./.microsmith-bin/microsmith ide refresh --repo-root examples/non-gradle/go
          ./.microsmith-bin/microsmith ide doctor --repo-root examples/non-gradle/go --diagnostics json > go-ide-doctor.json
          grep -q "JetBrains IDE helper doctor checks passed." go-ide-doctor.json
          ./.microsmith-bin/microsmith run examples/non-gradle/go/build.microsmith.kts --out examples/non-gradle/go/internal/gen
          test -f examples/non-gradle/go/internal/gen/proto/GoUserCreated.proto
      - name: Install and verify from installer (Windows)
        id: install-windows
        if: ${{ always() && runner.os == 'Windows' && steps.build-release-windows.outcome == 'success' }}
        shell: pwsh
        run: |
          $distAsset = Get-ChildItem -Path .\cli\build\release-assets\microsmith-cli-*-dist.zip | Select-Object -First 1
          if (-not $distAsset) {
            Write-Error "Unable to locate CLI dist zip asset."
            exit 1
          }
          $version = [regex]::Match($distAsset.Name, 'microsmith-cli-(.+)-dist\.zip').Groups[1].Value
          $distShaPath = "$($distAsset.FullName).sha256"
          if (-not (Test-Path $distShaPath)) {
            Write-Error "Missing dist checksum file: $distShaPath"
            exit 1
          }
          $distSha = (Get-Content -Path $distShaPath -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          & .\cli\build\release-assets\microsmith-install.ps1 `
            -Version $version `
            -InstallRoot "$pwd\.microsmith-home" `
            -BinDir "$pwd\.microsmith-bin" `
            -DistFile $distAsset.FullName `
            -DistSha256 $distSha `
            -ForceRuntimeProvision `
            -NoProfileUpdate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & .\.microsmith-bin\microsmith.cmd --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          New-Item -ItemType Directory -Path install-smoke-repo -Force | Out-Null
          & .\.microsmith-bin\microsmith.cmd init --repo-root install-smoke-repo
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\install-smoke-repo\build.microsmith.kts)) {
            Write-Error "Expected build.microsmith.kts to exist after init."
            exit 1
          }
          if (-not (Test-Path .\install-smoke-repo\settings.microsmith.kts)) {
            Write-Error "Expected settings.microsmith.kts to exist after init."
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd run install-smoke-repo\build.microsmith.kts --out install-smoke-repo\generated
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\install-smoke-repo\generated\proto\UserCreated.proto)) {
            Write-Error "Expected generated\\proto\\UserCreated.proto to exist after run."
            exit 1
          }
      - name: Smoke test .NET onboarding fixture (Windows)
        if: ${{ always() && matrix.os == 'windows-latest' && steps.install-windows.outcome == 'success' }}
        shell: pwsh
        run: |
          & .\.microsmith-bin\microsmith.cmd init --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & .\.microsmith-bin\microsmith.cmd init --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\build.microsmith.kts)) {
            Write-Error "Expected build.microsmith.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\settings.microsmith.kts)) {
            Write-Error "Expected settings.microsmith.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\.microsmith\ide\build.gradle.kts)) {
            Write-Error "Expected IDE helper build.gradle.kts to exist for the .NET fixture."
            exit 1
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\.microsmith\ide\README.md)) {
            Write-Error "Expected IDE helper README.md to exist for the .NET fixture."
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd ide refresh --repo-root examples/non-gradle/dotnet
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $ideDoctor = & .\.microsmith-bin\microsmith.cmd ide doctor --repo-root examples/non-gradle/dotnet --diagnostics json 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output $ideDoctor
            exit $LASTEXITCODE
          }
          if (($ideDoctor -join "`n") -notmatch "JetBrains IDE helper doctor checks passed.") {
            Write-Error "IDE helper doctor did not report success for the .NET fixture."
            Write-Output $ideDoctor
            exit 1
          }
          & .\.microsmith-bin\microsmith.cmd run examples/non-gradle/dotnet/build.microsmith.kts --out examples/non-gradle/dotnet/Generated
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path .\examples\non-gradle\dotnet\Generated\proto\DotnetUserCreated.proto)) {
            Write-Error "Expected Generated\\proto\\DotnetUserCreated.proto to exist for the .NET fixture."
            exit 1
          }
