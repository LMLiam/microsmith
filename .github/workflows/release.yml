name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: "Which version to bump (patch, minor, major)"
        required: true
        default: Patch
        options:
          - Patch
          - Minor
          - Major
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
          cache: gradle

      - name: Run Axion Release
        id: release
        run: ./gradlew release -Prelease.versionIncrementer=increment${{ github.event.inputs.bump }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release assets
        run: ./gradlew :cli:releaseArtifacts :runtime-scripting:ideFallbackArtifacts :runtime-scripting:generateIdeFallbackChecksums --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.released-version }}
          generate_release_notes: true
          append_body: true
          body_path: .github/release-notes.md
          files: |
            modules/cli/build/release-assets/microsmith-cli-*-all.jar
            modules/cli/build/release-assets/microsmith-cli-*-dist.zip
            modules/cli/build/release-assets/microsmith-cli-*-dist.tar.gz
            modules/cli/build/release-assets/microsmith-install.sh
            modules/cli/build/release-assets/microsmith-install.ps1
            modules/cli/build/release-assets/*.sha256
            modules/runtime-scripting/build/release-assets/microsmith-script-definition-*-all.jar
            modules/runtime-scripting/build/release-assets/microsmith-script-definition-*-all.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
