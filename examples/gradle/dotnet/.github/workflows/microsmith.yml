name: Microsmith Generate (.NET Gradle Native Fixture)
on:
  workflow_dispatch:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Generate ASP.NET service
        run: ./gradlew microsmithGenerate -PmicrosmithVersion="$MICROSMITH_VERSION"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build generated ASP.NET project
        run: dotnet build Generated/dotnet/Platform/UserService.Api/UserService.Api.csproj
