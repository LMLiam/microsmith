name: Microsmith Generate (.NET Fixture)
on:
  workflow_dispatch:
  pull_request:

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install Microsmith
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:MICROSMITH_INSTALLER_PS1_URL -OutFile microsmith-install.ps1
          .\microsmith-install.ps1 -Version $env:MICROSMITH_VERSION
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME ".microsmith\bin")
      - name: Bootstrap Microsmith
        shell: pwsh
        working-directory: examples/non-gradle/dotnet
        run: microsmith init
      - name: Generate ASP.NET scaffold
        shell: pwsh
        working-directory: examples/non-gradle/dotnet
        run: |
          microsmith run build.microsmith.kts --out .\Generated
          if (-not (Test-Path .\Generated\dotnet\Platform\UserService.Api\UserService.Api.csproj)) {
            Write-Error "Expected Generated\\dotnet\\Platform\\UserService.Api\\UserService.Api.csproj to exist."
            exit 1
          }
          if (-not (Test-Path .\Generated\dotnet\Platform\UserService.Api\Controllers\UserServiceController.cs)) {
            Write-Error "Expected Generated\\dotnet\\Platform\\UserService.Api\\Controllers\\UserServiceController.cs to exist."
            exit 1
          }
          dotnet build .\Generated\dotnet\Platform\UserService.Api\UserService.Api.csproj
