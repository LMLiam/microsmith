def scriptingVersionValue = version.toString()
def scriptingScriptTemplateFqcn = 'io.github.lmliam.microsmith.runtime.scripting.definition.MicrosmithScript'
def scriptingCompilationConfigurationFqcn =
    'io.github.lmliam.microsmith.runtime.scripting.definition.MicrosmithScriptCompilationConfiguration'
def scriptingContextFqcn = 'io.github.lmliam.microsmith.runtime.scripting.context.MicrosmithScriptContext'
def scriptingScriptTemplateMetaInfPrefix = 'META-INF/kotlin/script/templates'
def scriptingIdeFallbackBaseName = 'microscript-definition'
def scriptingIdeFallbackClassifier = 'all'

def scriptingApiProjectPaths = [
    ':runtime-scripting-api',
    ':dsl',
    ':dsl-services',
    ':dsl-services-dotnet',
    ':dsl-services-dotnet-asp',
    ':dsl-services-dotnet-packages',
    ':dsl-schemas',
    ':dsl-schemas-protobuf',
    ':dsl-schemas-protobuf-rpc',
]

def scriptingIdeFallbackReleaseAssetsDirectory = layout.buildDirectory.dir('release-assets')
def scriptingPublishedPomFile = layout.buildDirectory.file('publications/gpr/pom-default.xml')

def scriptingClassEntry = { String fqcn ->
    int lastDotIndex = fqcn.lastIndexOf('.')
    "${fqcn.substring(0, lastDotIndex).replace('.', '/')}/${fqcn.substring(lastDotIndex + 1)}.class"
}

def scriptingJarEntries = [
    scriptingClassEntry(scriptingScriptTemplateFqcn),
    "${scriptingScriptTemplateMetaInfPrefix}/${scriptingScriptTemplateFqcn}",
]

def scriptingIdeFallbackEntries = scriptingJarEntries + [
    scriptingClassEntry(scriptingCompilationConfigurationFqcn),
    scriptingClassEntry(scriptingContextFqcn),
    'kotlin/script/experimental/jvmhost/BasicJvmScriptingHost.class',
]

def scriptingCommonLibrary = libs.kotlin.scripting.common.get()
def scriptingPomScopes = scriptingApiProjectPaths.collect { path ->
    def dependencyProject = project(path)
    "${dependencyProject.group}:${dependencyProject.name}=compile"
} + ["${scriptingCommonLibrary.group}:${scriptingCommonLibrary.name}=compile"]

