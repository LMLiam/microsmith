def scriptingShadowJarTask = tasks.named('shadowJar', ShadowJar)

scriptingShadowJarTask.configure { shadowJarTask ->
    archiveBaseName.set(scriptingIdeFallbackBaseName)
    archiveClassifier.set(scriptingIdeFallbackClassifier)
    filesMatching('META-INF/services/**') { details ->
        details.duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    manifest {
        attributes('Implementation-Version': scriptingVersionValue)
    }
}

tasks.register('verifyRuntimeScriptingJar', VerifyJarEntries) {
    dependsOn(tasks.named('jar'))
    archive.set(tasks.named('jar', Jar).flatMap { jarTask -> jarTask.archiveFile })
    expectedEntries.set(scriptingJarEntries)
    artifactDescription.set('Runtime-scripting jar')
}

tasks.register('verifyRuntimeScriptingPublishedPom', VerifyPublishedPomScopes) {
    dependsOn(tasks.named('generatePomFileForGprPublication'))
    pomFile.set(scriptingPublishedPomFile)
    expectedScopes.set(scriptingPomScopes)
    artifactDescription.set('Runtime-scripting published pom')
}

def verifyIdeFallbackEntriesTask = tasks.register('verifyIdeFallbackJarEntries', VerifyJarEntries) {
    dependsOn(scriptingShadowJarTask)
    archive.set(scriptingShadowJarTask.flatMap { shadowJarTask -> shadowJarTask.archiveFile })
    expectedEntries.set(scriptingIdeFallbackEntries)
    artifactDescription.set('IDE fallback shadow jar')
}

def verifyIdeFallbackProvidersTask = tasks.register('verifyIdeFallbackServiceProviders', VerifyServiceProviders) {
    dependsOn(scriptingShadowJarTask)
    archive.set(scriptingShadowJarTask.flatMap { shadowJarTask -> shadowJarTask.archiveFile })
    expectedProviders.set(scriptingIdeFallbackServiceProviders)
    artifactDescription.set('IDE fallback shadow jar')
}

def verifyIdeFallbackShadowJarTask = tasks.register('verifyIdeFallbackShadowJar') {
    description = 'Verifies the IDE fallback shadow jar entries and merged service providers.'
    group = 'verification'
    dependsOn(verifyIdeFallbackEntriesTask, verifyIdeFallbackProvidersTask)
}

def ideFallbackArtifactsTask = tasks.register('ideFallbackArtifacts', Sync) {
    dependsOn(verifyIdeFallbackShadowJarTask)
    into(scriptingIdeFallbackReleaseAssetsDirectory)
    from(scriptingShadowJarTask)
}

tasks.register('generateIdeFallbackChecksums', GenerateChecksums) {
    dependsOn(ideFallbackArtifactsTask)
    assets.from(
        scriptingIdeFallbackReleaseAssetsDirectory.map { dir ->
            dir.asFileTree.matching { exclude '**/*.sha256' }
        },
    )
}

tasks.named('check') {
    dependsOn(
        tasks.named('verifyRuntimeScriptingJar'),
        tasks.named('verifyRuntimeScriptingPublishedPom'),
        verifyIdeFallbackShadowJarTask,
    )
}
