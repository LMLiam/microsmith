plugins {
    id 'java-library'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.jvm.tasks.Jar
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.JarFile
import java.util.regex.Pattern

class RuntimeScriptingBuildNames {
    static final List<String> API_PROJECT_PATHS = [
        ':dsl',
        ':dsl-schemas',
        ':dsl-schemas-protobuf',
        ':dsl-schemas-protobuf-rpc',
    ]

    static final List<String> IMPLEMENTATION_PROJECT_PATHS = [
        ':gen',
        ':gen-schemas',
        ':gen-schemas-protobuf',
        ':gen-schemas-protobuf-rpc',
    ]

    static final String JAR_TASK_NAME = 'jar'
    static final String SHADOW_JAR_TASK_NAME = 'shadowJar'
    static final String GENERATE_POM_TASK_NAME = 'generatePomFileForGprPublication'
    static final String CHECK_TASK_NAME = 'check'
    static final String POM_PATH = 'publications/gpr/pom-default.xml'
    static final String RELATIVE_RELEASE_ASSETS_DIRECTORY = 'release-assets'
    static final String IDE_FALLBACK_SHADOW_JAR_BASE_NAME = 'microsmith-script-definition'
    static final String IDE_FALLBACK_SHADOW_JAR_CLASSIFIER = 'all'
    static final String SCRIPT_TEMPLATE_META_INF_PREFIX = 'META-INF/kotlin/script/templates'
    static final String SCRIPT_DEFINITION_TEMPLATE_FQCN =
        'io.github.lmliam.microsmith.runtime.scripting.definition.MicrosmithScript'
    static final String SCRIPT_DEFINITION_PACKAGE_PATH =
        SCRIPT_DEFINITION_TEMPLATE_FQCN.substring(0, SCRIPT_DEFINITION_TEMPLATE_FQCN.lastIndexOf('.')).replace('.', '/')
    static final String SCRIPT_CONTEXT_PACKAGE_PATH = 'io/github/lmliam/microsmith/runtime/scripting/context'
    static final String SCRIPT_DEFINITION_SCRIPT_CLASS_NAME = 'MicrosmithScript'
    static final String SCRIPT_DEFINITION_COMPILATION_CONFIGURATION_CLASS_NAME = 'MicrosmithScriptCompilationConfiguration'
    static final String SCRIPT_DEFINITION_CONTEXT_CLASS_NAME = 'MicrosmithScriptContext'

    static String classEntryName(String packagePath, String simpleName) {
        "${packagePath}/${simpleName}.class"
    }

    static String scriptTemplateRegistrationEntry(String templateFqcn) {
        "${SCRIPT_TEMPLATE_META_INF_PREFIX}/${templateFqcn}"
    }

    static String projectCoordinate(def dependencyProject) {
        "${dependencyProject.group}:${dependencyProject.name}"
    }

    static String libraryCoordinate(def dependency) {
        "${dependency.module.group}:${dependency.module.name}"
    }
}

dependencies {
    RuntimeScriptingBuildNames.API_PROJECT_PATHS.each { api project(it) }
    RuntimeScriptingBuildNames.IMPLEMENTATION_PROJECT_PATHS.each { implementation project(it) }
    implementation libs.coroutines.core
    api libs.kotlin.scripting.common
    implementation libs.kotlin.scripting.jvm
    implementation libs.kotlin.scripting.jvm.host
}

def scriptTemplateRegistrationEntry =
    RuntimeScriptingBuildNames.scriptTemplateRegistrationEntry(RuntimeScriptingBuildNames.SCRIPT_DEFINITION_TEMPLATE_FQCN)
def runtimeScriptingJarTask = tasks.named(RuntimeScriptingBuildNames.JAR_TASK_NAME, Jar)
def runtimeScriptingJarArchive = runtimeScriptingJarTask.flatMap { it.archiveFile }
def runtimeScriptingPomTask = tasks.named(RuntimeScriptingBuildNames.GENERATE_POM_TASK_NAME)
def runtimeScriptingPomFile = layout.buildDirectory.file(RuntimeScriptingBuildNames.POM_PATH)
def runtimeScriptingJarExpectedEntries = [
    RuntimeScriptingBuildNames.classEntryName(
        RuntimeScriptingBuildNames.SCRIPT_DEFINITION_PACKAGE_PATH,
        RuntimeScriptingBuildNames.SCRIPT_DEFINITION_SCRIPT_CLASS_NAME,
    ),
    scriptTemplateRegistrationEntry,
]
def runtimeScriptingPomExpectedScopes = RuntimeScriptingBuildNames.API_PROJECT_PATHS.collectEntries { path ->
    def dependencyProject = project(path)
    [(RuntimeScriptingBuildNames.projectCoordinate(dependencyProject)): 'compile']
}
runtimeScriptingPomExpectedScopes[RuntimeScriptingBuildNames.libraryCoordinate(libs.kotlin.scripting.common.get())] = 'compile'
def ideFallbackReleaseAssetsDirectory = layout.buildDirectory.dir(RuntimeScriptingBuildNames.RELATIVE_RELEASE_ASSETS_DIRECTORY)
def ideFallbackShadowJarTask = tasks.named(RuntimeScriptingBuildNames.SHADOW_JAR_TASK_NAME, ShadowJar)
def ideFallbackShadowJarArchive = ideFallbackShadowJarTask.flatMap { it.archiveFile }
def ideFallbackExpectedEntries = [
    RuntimeScriptingBuildNames.classEntryName(
        RuntimeScriptingBuildNames.SCRIPT_DEFINITION_PACKAGE_PATH,
        RuntimeScriptingBuildNames.SCRIPT_DEFINITION_SCRIPT_CLASS_NAME,
    ),
    RuntimeScriptingBuildNames.classEntryName(
        RuntimeScriptingBuildNames.SCRIPT_DEFINITION_PACKAGE_PATH,
        RuntimeScriptingBuildNames.SCRIPT_DEFINITION_COMPILATION_CONFIGURATION_CLASS_NAME,
    ),
    RuntimeScriptingBuildNames.classEntryName(
        RuntimeScriptingBuildNames.SCRIPT_CONTEXT_PACKAGE_PATH,
        RuntimeScriptingBuildNames.SCRIPT_DEFINITION_CONTEXT_CLASS_NAME,
    ),
    'kotlin/script/experimental/jvmhost/BasicJvmScriptingHost.class',
    scriptTemplateRegistrationEntry,
]

tasks.named(RuntimeScriptingBuildNames.SHADOW_JAR_TASK_NAME, ShadowJar) {
    archiveBaseName.set(RuntimeScriptingBuildNames.IDE_FALLBACK_SHADOW_JAR_BASE_NAME)
    archiveClassifier.set(RuntimeScriptingBuildNames.IDE_FALLBACK_SHADOW_JAR_CLASSIFIER)
    manifest {
        attributes(
            "Implementation-Version": project.version.toString(),
        )
    }
}

def verifyJarEntries = { File archiveFile, List<String> expectedEntries, String artifactDescription ->
    if (!archiveFile.isFile()) {
        throw new GradleException("${artifactDescription} '${archiveFile.path}' was not created.")
    }

    JarFile jarFile = new JarFile(archiveFile)
    try {
        def entryNames = jarFile.entries().collect { entry -> entry.name } as Set
        def missingEntries = expectedEntries.findAll { expected -> !entryNames.contains(expected) }
        if (!missingEntries.isEmpty()) {
            throw new GradleException(
                "${artifactDescription} '${archiveFile.name}' is missing expected entries: ${missingEntries.join(', ')}",
            )
        }
    } finally {
        jarFile.close()
    }
}

tasks.register("verifyRuntimeScriptingJar") {
    dependsOn(runtimeScriptingJarTask)
    inputs.file(runtimeScriptingJarArchive)

    doLast {
        verifyJarEntries(
            runtimeScriptingJarArchive.get().asFile,
            runtimeScriptingJarExpectedEntries,
            "Runtime-scripting jar",
        )
    }
}

tasks.register("verifyRuntimeScriptingPublishedPom") {
    dependsOn(runtimeScriptingPomTask)
    inputs.file(runtimeScriptingPomFile)

    doLast {
        File pomFile = runtimeScriptingPomFile.get().asFile
        if (!pomFile.isFile()) {
            throw new GradleException("Runtime-scripting published pom '${pomFile.path}' was not created.")
        }

        String pomContents = pomFile.getText(StandardCharsets.UTF_8.name())

        def invalidScopes =
            runtimeScriptingPomExpectedScopes.findAll { dependencyCoordinates, expectedScope ->
                def (groupId, artifactId) = dependencyCoordinates.split(":")
                def dependencyPattern = Pattern.compile(
                    "(?s)<dependency>\\s*<groupId>${Pattern.quote(groupId)}</groupId>\\s*" +
                        "<artifactId>${Pattern.quote(artifactId)}</artifactId>\\s*" +
                        "<version>[^<]+</version>\\s*" +
                        "<scope>${Pattern.quote(expectedScope)}</scope>\\s*</dependency>",
                )
                !dependencyPattern.matcher(pomContents).find()
            }
        if (!invalidScopes.isEmpty()) {
            def formattedInvalidScopes =
                invalidScopes.collect { dependencyCoordinates, expectedScope ->
                    "${dependencyCoordinates} expected ${expectedScope} scope"
                }
            throw new GradleException(
                "Runtime-scripting published pom '${pomFile.name}' had unexpected dependency scopes: ${formattedInvalidScopes.join(', ')}",
            )
        }
    }
}

tasks.register("verifyIdeFallbackShadowJar") {
    dependsOn(ideFallbackShadowJarTask)
    inputs.file(ideFallbackShadowJarArchive)

    doLast {
        verifyJarEntries(
            ideFallbackShadowJarArchive.get().asFile,
            ideFallbackExpectedEntries,
            "IDE fallback shadow jar",
        )
    }
}

tasks.register("ideFallbackArtifacts", Sync) {
    dependsOn(tasks.named("verifyIdeFallbackShadowJar"))
    into(ideFallbackReleaseAssetsDirectory)
    from(ideFallbackShadowJarArchive)
}

tasks.register("generateIdeFallbackChecksums") {
    dependsOn(tasks.named("ideFallbackArtifacts"))
    inputs.dir(ideFallbackReleaseAssetsDirectory)
    outputs.dir(ideFallbackReleaseAssetsDirectory)

    doLast {
        File releaseDir = ideFallbackReleaseAssetsDirectory.get().asFile
        if (!releaseDir.isDirectory()) {
            throw new GradleException("IDE fallback release assets directory '${releaseDir.path}' does not exist.")
        }

        def sourceFiles =
            releaseDir.listFiles()
                .findAll { file -> file.isFile() && !file.name.endsWith('.sha256') }
                .sort { left, right -> left.name <=> right.name }
        if (sourceFiles.isEmpty()) {
            throw new GradleException("IDE fallback release assets directory '${releaseDir.path}' did not contain files to checksum.")
        }

        sourceFiles.each { file ->
            String checksum = MessageDigest.getInstance("SHA-256").digest(file.bytes).encodeHex().toString()
            new File(releaseDir, "${file.name}.sha256").setText("${checksum}  ${file.name}\n", StandardCharsets.UTF_8.name())
        }
    }
}

tasks.named(RuntimeScriptingBuildNames.CHECK_TASK_NAME) {
    dependsOn(tasks.named("verifyRuntimeScriptingJar"))
    dependsOn(tasks.named("verifyRuntimeScriptingPublishedPom"))
    dependsOn(tasks.named("verifyIdeFallbackShadowJar"))
}
