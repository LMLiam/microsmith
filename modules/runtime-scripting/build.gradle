import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.jvm.tasks.Jar
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.JarFile

dependencies {
    implementation project(":dsl")
    implementation project(":dsl-schemas")
    implementation project(":dsl-schemas-protobuf")
    implementation project(":gen")
    implementation project(":gen-schemas")
    implementation project(":gen-schemas-protobuf")
    implementation libs.coroutines.core
    implementation libs.kotlin.scripting.common
    implementation libs.kotlin.scripting.jvm
    implementation libs.kotlin.scripting.jvm.host
}

def scriptTemplateRegistrationEntry =
    "META-INF/kotlin/script/templates/io.github.lmliam.microsmith.runtime.scripting.definition.MicrosmithScript"
def runtimeScriptingJarTask = tasks.named("jar", Jar)
def runtimeScriptingJarArchive = runtimeScriptingJarTask.flatMap { it.archiveFile }
def runtimeScriptingJarExpectedEntries = [
    "io/github/lmliam/microsmith/runtime/scripting/definition/MicrosmithScript.class",
    scriptTemplateRegistrationEntry,
]
def ideFallbackReleaseAssetsDirectory = layout.buildDirectory.dir("release-assets")
def ideFallbackShadowJarTask = tasks.named("shadowJar", ShadowJar)
def ideFallbackShadowJarArchive = ideFallbackShadowJarTask.flatMap { it.archiveFile }
def ideFallbackExpectedEntries = [
    "io/github/lmliam/microsmith/runtime/scripting/definition/MicrosmithScript.class",
    "io/github/lmliam/microsmith/runtime/scripting/definition/MicrosmithScriptCompilationConfiguration.class",
    "io/github/lmliam/microsmith/runtime/scripting/context/MicrosmithScriptContext.class",
    "kotlin/script/experimental/jvmhost/BasicJvmScriptingHost.class",
    scriptTemplateRegistrationEntry,
]

tasks.named("shadowJar", ShadowJar) {
    archiveBaseName.set("microsmith-script-definition")
    archiveClassifier.set("all")
    manifest {
        attributes(
            "Implementation-Version": project.version.toString(),
        )
    }
}

def verifyJarEntries = { File archiveFile, List<String> expectedEntries, String artifactDescription ->
    if (!archiveFile.isFile()) {
        throw new GradleException("${artifactDescription} '${archiveFile.path}' was not created.")
    }

    JarFile jarFile = new JarFile(archiveFile)
    try {
        def entryNames = jarFile.entries().collect { entry -> entry.name } as Set
        def missingEntries = expectedEntries.findAll { expected -> !entryNames.contains(expected) }
        if (!missingEntries.isEmpty()) {
            throw new GradleException(
                "${artifactDescription} '${archiveFile.name}' is missing expected entries: ${missingEntries.join(', ')}",
            )
        }
    } finally {
        jarFile.close()
    }
}

tasks.register("verifyRuntimeScriptingJar") {
    dependsOn(runtimeScriptingJarTask)
    inputs.file(runtimeScriptingJarArchive)

    doLast {
        verifyJarEntries(
            runtimeScriptingJarArchive.get().asFile,
            runtimeScriptingJarExpectedEntries,
            "Runtime-scripting jar",
        )
    }
}

tasks.register("verifyIdeFallbackShadowJar") {
    dependsOn(ideFallbackShadowJarTask)
    inputs.file(ideFallbackShadowJarArchive)

    doLast {
        verifyJarEntries(
            ideFallbackShadowJarArchive.get().asFile,
            ideFallbackExpectedEntries,
            "IDE fallback shadow jar",
        )
    }
}

tasks.register("ideFallbackArtifacts", Sync) {
    dependsOn(tasks.named("verifyIdeFallbackShadowJar"))
    into(ideFallbackReleaseAssetsDirectory)
    from(ideFallbackShadowJarArchive)
}

tasks.register("generateIdeFallbackChecksums") {
    dependsOn(tasks.named("ideFallbackArtifacts"))
    inputs.dir(ideFallbackReleaseAssetsDirectory)
    outputs.dir(ideFallbackReleaseAssetsDirectory)

    doLast {
        File releaseDir = ideFallbackReleaseAssetsDirectory.get().asFile
        if (!releaseDir.isDirectory()) {
            throw new GradleException("IDE fallback release assets directory '${releaseDir.path}' does not exist.")
        }

        def sourceFiles =
            releaseDir.listFiles()
                .findAll { file -> file.isFile() && !file.name.endsWith('.sha256') }
                .sort { left, right -> left.name <=> right.name }
        if (sourceFiles.isEmpty()) {
            throw new GradleException("IDE fallback release assets directory '${releaseDir.path}' did not contain files to checksum.")
        }

        sourceFiles.each { file ->
            String checksum = MessageDigest.getInstance("SHA-256").digest(file.bytes).encodeHex().toString()
            new File(releaseDir, "${file.name}.sha256").setText("${checksum}  ${file.name}\n", StandardCharsets.UTF_8.name())
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("verifyRuntimeScriptingJar"))
    dependsOn(tasks.named("verifyIdeFallbackShadowJar"))
}
