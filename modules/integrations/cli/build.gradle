import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import io.github.lmliam.microsmith.build.GenerateChecksums
import io.github.lmliam.microsmith.build.cli.GenerateBundledPluginCatalog
import io.github.lmliam.microsmith.build.cli.VerifyDistLayout
import io.github.lmliam.microsmith.build.cli.VerifyShadowJarServices
import org.apache.tools.ant.filters.ReplaceTokens

// Packaging names. One producer and several verifiers read each value.
def cliVersionValue = version.toString()
def cliMainClassName = 'io.github.lmliam.microsmith.cli.CliKt'
def cliCatalogFormatVersion = 1
def cliCatalogFileName = 'bundled-plugins.lock'
def cliCatalogJarPath = "META-INF/microsmith/${cliCatalogFileName}"
def cliShadowJarBaseName = 'microsmith-cli'
def cliShadowJarClassifier = 'all'
def cliShadowJarArchiveName = "${cliShadowJarBaseName}-${cliVersionValue}-${cliShadowJarClassifier}.jar".toString()
def cliDistRootName = "${cliShadowJarBaseName}-${cliVersionValue}".toString()
def cliReadmeFileName = 'README.txt'
def cliUnixLauncherName = 'microsmith'
def cliWindowsLauncherName = 'microsmith.bat'
def cliUnixLauncherMode = 493 // 0755

// The runtime plugin modules that the CLI bundles. The declared order is the catalog order.
def cliBundledPluginPaths = [
    ':resolve-services',
    ':resolve-services-dotnet',
    ':resolve-services-dotnet-asp',
    ':resolve-services-dotnet-packages',
    ':resolve-schemas',
    ':resolve-schemas-protobuf',
    ':resolve-schemas-protobuf-rpc',
    ':artifact',
    ':artifact-services',
    ':artifact-services-dotnet',
    ':artifact-services-dotnet-asp',
    ':artifact-services-dotnet-packages',
    ':artifact-schemas-protobuf',
    ':artifact-schemas-protobuf-rpc',
    ':compile-services',
    ':compile-services-dotnet',
    ':compile-services-dotnet-asp',
    ':compile-services-dotnet-packages',
    ':compile-schemas-protobuf',
    ':compile-schemas-protobuf-rpc',
    ':gen',
]

def cliCatalogDirectory = layout.buildDirectory.dir('generated/microsmith')
def cliCatalogFile = layout.buildDirectory.file("generated/microsmith/${cliCatalogFileName}")
def cliDistDirectory = layout.buildDirectory.dir('microsmith-cli-dist')
def cliReleaseAssetsDirectory = layout.buildDirectory.dir('release-assets')

def cliBundledPluginProjects = cliBundledPluginPaths.collect { path -> project(path) }
def cliBundledPluginJarTasks = cliBundledPluginProjects.collect { pluginProject ->
    pluginProject.tasks.named('jar', Jar)
}
def cliBundledPluginJarFiles = cliBundledPluginProjects.collect { pluginProject ->
    pluginProject.tasks.named('jar', Jar).flatMap { jarTask -> jarTask.archiveFile }
}
def cliBundledPluginCoordinates = cliBundledPluginProjects.collect { pluginProject ->
    "${pluginProject.group}:${pluginProject.name}:${pluginProject.version}"
}

def cliShadowJarTask = tasks.named('shadowJar', ShadowJar)
def cliShadowJarArchive = cliShadowJarTask.flatMap { shadowJarTask -> shadowJarTask.archiveFile }

dependencies {
    implementation project(':runtime-scripting')
    implementation project(':dsl')
    implementation project(':dsl-services')
    implementation project(':dsl-services-dotnet')
    implementation project(':dsl-services-dotnet-asp')
    implementation project(':dsl-services-dotnet-packages')
    implementation project(':dsl-schemas')
    implementation project(':dsl-schemas-protobuf')
    implementation project(':dsl-schemas-protobuf-rpc')
    implementation project(':resolve')
    implementation project(':resolve-services')
    implementation project(':resolve-services-dotnet')
    implementation project(':resolve-services-dotnet-asp')
    implementation project(':resolve-services-dotnet-packages')
    implementation project(':resolve-schemas')
    implementation project(':resolve-schemas-protobuf')
    implementation project(':resolve-schemas-protobuf-rpc')
    implementation project(':artifact')
    implementation project(':artifact-services')
    implementation project(':artifact-services-dotnet')
    implementation project(':artifact-services-dotnet-asp')
    implementation project(':artifact-services-dotnet-packages')
    implementation project(':artifact-schemas')
    implementation project(':artifact-schemas-protobuf')
    implementation project(':artifact-schemas-protobuf-rpc')
    implementation project(':compile')
    implementation project(':compile-services')
    implementation project(':compile-services-dotnet')
    implementation project(':compile-services-dotnet-asp')
    implementation project(':compile-services-dotnet-packages')
    implementation project(':compile-schemas')
    implementation project(':compile-schemas-protobuf')
    implementation project(':compile-schemas-protobuf-rpc')
    implementation project(':gen')
    implementation libs.maven.resolver.api
    implementation libs.maven.resolver.spi
    implementation libs.maven.resolver.util
    implementation libs.maven.resolver.impl
    implementation libs.maven.resolver.supplier
    implementation libs.maven.resolver.connector.basic
    implementation libs.maven.resolver.transport.file
    implementation libs.maven.resolver.transport.http
}

// The catalog ships at the JAR root and under META-INF/microsmith inside the shaded JAR.
sourceSets.main.resources.srcDir(cliCatalogDirectory)

cliShadowJarTask.configure { shadowJarTask ->
    archiveBaseName.set(cliShadowJarBaseName)
    archiveClassifier.set(cliShadowJarClassifier)
    filesMatching('META-INF/services/**') { details ->
        details.duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': cliMainClassName,
            'Implementation-Version': cliVersionValue,
        )
    }
    outputs.cacheIf { false }
}

def generateCatalogTask = tasks.register('generateBundledPluginCatalog', GenerateBundledPluginCatalog) {
    dependsOn(cliBundledPluginJarTasks)
    cliVersion.set(cliVersionValue)
    formatVersion.set(cliCatalogFormatVersion)
    pluginCoordinates.set(cliBundledPluginCoordinates)
    pluginJars.from(cliBundledPluginJarFiles)
    catalogFile.set(cliCatalogFile)
}

tasks.named('processResources', Copy) {
    dependsOn(generateCatalogTask)
    from(cliCatalogFile) { into 'META-INF/microsmith' }
}

tasks.named('sourcesJar', Jar) {
    dependsOn(generateCatalogTask)
}

def verifyShadowJarServicesTask = tasks.register('verifyShadowJarServices', VerifyShadowJarServices) {
    dependsOn(cliShadowJarTask, generateCatalogTask)
    shadowJarFile.set(cliShadowJarArchive)
    catalogFile.set(cliCatalogFile)
    catalogJarPath.set(cliCatalogJarPath)
    cliVersion.set(cliVersionValue)
    formatVersion.set(cliCatalogFormatVersion)
    pluginCoordinates.set(cliBundledPluginCoordinates)
    pluginJars.from(cliBundledPluginJarFiles)
}

tasks.named('check') {
    dependsOn(verifyShadowJarServicesTask)
}

def prepareDistTask = tasks.register('prepareDist', Sync) {
    dependsOn(cliShadowJarTask, generateCatalogTask)
    into(cliDistDirectory)
    from(cliShadowJarArchive) { into 'lib' }
    from(file('src/dist/launcher/microsmith')) {
        into 'bin'
        filter(ReplaceTokens, tokens: ['CLI_JAR': cliShadowJarArchiveName])
        filePermissions { permissions -> permissions.unix(cliUnixLauncherMode) }
    }
    from(file('src/dist/launcher/microsmith.bat')) {
        into 'bin'
        filter(ReplaceTokens, tokens: ['CLI_JAR': cliShadowJarArchiveName])
    }
    from(file('src/dist/README.txt')) { into '.' }
    from(cliCatalogFile) { into '.' }
}

def cliDistZipTask = tasks.register('cliDistZip', Zip) {
    dependsOn(prepareDistTask)
    inputs.property('unixLauncherPermissions', cliUnixLauncherMode)
    archiveBaseName.set(cliShadowJarBaseName)
    archiveVersion.set(cliVersionValue)
    archiveClassifier.set('dist')
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    from(cliDistDirectory) {
        into(cliDistRootName)
        // Gradle archives use mode 0644 by default. Override the Unix launcher permission.
        filesMatching("**/bin/${cliUnixLauncherName}") { launcher ->
            launcher.permissions { permissions -> permissions.unix(cliUnixLauncherMode) }
        }
    }
}

def cliDistTarTask = tasks.register('cliDistTar', Tar) {
    dependsOn(prepareDistTask)
    inputs.property('unixLauncherPermissions', cliUnixLauncherMode)
    compression = Compression.GZIP
    archiveBaseName.set(cliShadowJarBaseName)
    archiveVersion.set(cliVersionValue)
    archiveClassifier.set('dist')
    archiveExtension.set('tar.gz')
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    from(cliDistDirectory) {
        into(cliDistRootName)
        filesMatching("**/bin/${cliUnixLauncherName}") { launcher ->
            launcher.permissions { permissions -> permissions.unix(cliUnixLauncherMode) }
        }
    }
}

def verifyDistLayoutTask = tasks.register('verifyDistLayout', VerifyDistLayout) {
    dependsOn(prepareDistTask, cliDistZipTask, cliDistTarTask, generateCatalogTask)
    distDirectory.set(cliDistDirectory)
    catalogFile.set(cliCatalogFile)
    zipArchive.set(cliDistZipTask.flatMap { zipTask -> zipTask.archiveFile })
    tarArchive.set(cliDistTarTask.flatMap { tarTask -> tarTask.archiveFile })
    distRootName.set(cliDistRootName)
    catalogFileName.set(cliCatalogFileName)
    readmeFileName.set(cliReadmeFileName)
    shadowJarArchiveName.set(cliShadowJarArchiveName)
    unixLauncherName.set(cliUnixLauncherName)
    windowsLauncherName.set(cliWindowsLauncherName)
}

def distArtifactsTask = tasks.register('distArtifacts', Sync) {
    dependsOn(verifyShadowJarServicesTask, verifyDistLayoutTask)
    into(cliReleaseAssetsDirectory)
    from(cliShadowJarArchive)
    from(cliDistZipTask)
    from(cliDistTarTask)
    from(file('src/install/microsmith-install.sh')) {
        into '.'
        filePermissions { permissions -> permissions.unix(cliUnixLauncherMode) }
    }
    from(file('src/install/microsmith-install.ps1')) {
        into '.'
    }
}

def generateReleaseChecksumsTask = tasks.register('generateReleaseChecksums', GenerateChecksums) {
    dependsOn(distArtifactsTask)
    assets.from(cliReleaseAssetsDirectory.map { dir -> dir.asFileTree.matching { exclude '**/*.sha256' } })
}

tasks.register('releaseArtifacts') {
    description = 'Assembles the CLI shadow jar, the distributions, the installers, and the checksums.'
    group = 'distribution'
    dependsOn(distArtifactsTask, generateReleaseChecksumsTask)
}
