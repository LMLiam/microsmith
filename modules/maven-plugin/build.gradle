import groovy.xml.MarkupBuilder
import groovy.xml.XmlUtil
import org.gradle.api.artifacts.Configuration
import java.nio.charset.StandardCharsets

def mavenPluginArtifactId = "microsmith-maven-plugin"
def mavenPluginGoalPrefix = "microsmith"
def mavenGenerateGoal = "generate"
def pluginDescriptorOutput = layout.buildDirectory.file("generated/resources/plugin/META-INF/maven/plugin.xml")

dependencies {
    implementation project(":runtime-scripting")
    compileOnly libs.maven.plugin.api
    testImplementation libs.maven.plugin.api
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir("generated/resources/plugin"))

class MavenPluginDescriptorWriter {
    static void write(
        File outputFile,
        String pluginGroupId,
        String pluginArtifactId,
        String pluginVersion,
        String goalPrefixValue,
        String generateGoalValue,
        Configuration runtimeClasspath
    ) {
        def runtimeArtifacts = resolveRuntimeArtifacts(runtimeClasspath)
        outputFile.parentFile.mkdirs()

        def writer = new StringWriter()
        def xml = new MarkupBuilder(writer)
        xml.plugin {
            name("Microsmith Maven Plugin")
            description("Native Microsmith integration for Maven repositories")
            groupId(pluginGroupId)
            artifactId(pluginArtifactId)
            version(pluginVersion)
            goalPrefix(goalPrefixValue)
            isolatedRealm(false)
            inheritedByDefault(true)
            mojos {
                mojo {
                    goal(generateGoalValue)
                    description("Generates artifacts from a .microsmith.kts script.")
                    implementation("io.github.lmliam.microsmith.maven.MicrosmithGenerateMojo")
                    language("java")
                    phase("generate-resources")
                    instantiationStrategy("per-lookup")
                    executionStrategy("once-per-session")
                    requiresProject(true)
                    threadSafe(true)
                    parameters {
                        parameter {
                            name("projectBaseDirectory")
                            type("java.io.File")
                            required(false)
                            editable(false)
                            description("Repository base directory used to resolve relative Microsmith paths.")
                        }
                        parameter {
                            name("scriptFile")
                            type("java.io.File")
                            required(false)
                            editable(true)
                            description("Path to the .microsmith.kts script to execute.")
                        }
                        parameter {
                            name("outputDirectory")
                            type("java.io.File")
                            required(false)
                            editable(true)
                            description("Directory where generated outputs are written.")
                        }
                        parameter {
                            name("cacheDirectory")
                            type("java.io.File")
                            required(false)
                            editable(true)
                            description("Directory used for Microsmith script compilation cache entries.")
                        }
                        parameter {
                            name("variables")
                            type("java.util.Properties")
                            required(false)
                            editable(true)
                            description("Variables exposed to the script via requireVar and hasVar.")
                        }
                        parameter {
                            name("flags")
                            type("java.util.List")
                            required(false)
                            editable(true)
                            description("Flags exposed to the script via hasFlag.")
                        }
                    }
                    configuration {
                        projectBaseDirectory(
                            [implementation: "java.io.File", "default-value": '${project.basedir}'],
                            '${project.basedir}',
                        )
                        scriptFile(
                            [implementation: "java.io.File", "default-value": '${project.basedir}/build.microsmith.kts'],
                            '${microsmith.scriptFile}',
                        )
                        outputDirectory(
                            [implementation: "java.io.File", "default-value": '${project.build.directory}/generated/microsmith'],
                            '${microsmith.outputDirectory}',
                        )
                        cacheDirectory(
                            [implementation: "java.io.File", "default-value": '${project.build.directory}/tmp/microsmith/cache'],
                            '${microsmith.cacheDirectory}',
                        )
                        variables([implementation: "java.util.Properties"], '${microsmith.variables}')
                        flags([implementation: "java.util.List"], '${microsmith.flags}')
                    }
                }
            }
            dependencies {
                runtimeArtifacts.each { runtimeArtifact ->
                    dependency {
                        groupId(runtimeArtifact.groupId)
                        artifactId(runtimeArtifact.artifactId)
                        type(runtimeArtifact.type)
                        version(runtimeArtifact.version)
                        if (runtimeArtifact.classifier) {
                            classifier(runtimeArtifact.classifier)
                        }
                    }
                }
            }
        }

        outputFile.setText(XmlUtil.serialize(writer.toString()), StandardCharsets.UTF_8.name())
    }

    private static List<Map<String, String>> resolveRuntimeArtifacts(Configuration runtimeClasspath) {
        runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            .collect { artifact ->
                [
                    groupId   : artifact.moduleVersion.id.group,
                    artifactId: artifact.name,
                    version   : artifact.moduleVersion.id.version,
                    type      : artifact.extension ?: "jar",
                    classifier: artifact.classifier,
                ]
            }.sort { left, right ->
                dependencySortKey(left) <=> dependencySortKey(right)
            }
    }

    private static String dependencySortKey(Map<String, String> dependency) {
        [
            dependency.groupId,
            dependency.artifactId,
            dependency.version,
            dependency.classifier ?: "",
        ].join("|")
    }
}

def generateMavenPluginDescriptorTask = tasks.register("generateMavenPluginDescriptor") {
    def pluginGroupId = project.group.toString()
    def pluginVersion = project.version.toString()
    def descriptorFile = pluginDescriptorOutput

    inputs.property("pluginGroupId", pluginGroupId)
    inputs.property("pluginArtifactId", mavenPluginArtifactId)
    inputs.property("pluginVersion", pluginVersion)
    inputs.property("goalPrefix", mavenPluginGoalPrefix)
    inputs.property("generateGoal", mavenGenerateGoal)
    inputs.files(configurations.runtimeClasspath)
    outputs.file(descriptorFile)
    notCompatibleWithConfigurationCache("Maven plugin descriptor generation uses Groovy XML builder state.")

    doLast {
        MavenPluginDescriptorWriter.write(
            descriptorFile.get().asFile,
            pluginGroupId,
            mavenPluginArtifactId,
            pluginVersion,
            mavenPluginGoalPrefix,
            mavenGenerateGoal,
            configurations.runtimeClasspath
        )
    }
}

tasks.named("processResources") {
    dependsOn(generateMavenPluginDescriptorTask)
}

tasks.named("sourcesJar") {
    dependsOn(generateMavenPluginDescriptorTask)
}

tasks.register("verifyMavenPluginDescriptor") {
    def descriptorFile = pluginDescriptorOutput
    dependsOn(generateMavenPluginDescriptorTask)
    inputs.file(descriptorFile)
    notCompatibleWithConfigurationCache("Descriptor verification depends on the generated Groovy XML descriptor task.")

    doLast {
        def descriptorOutputFile = descriptorFile.get().asFile
        if (!descriptorOutputFile.isFile()) {
            throw new GradleException("Maven plugin descriptor '${descriptorOutputFile.path}' was not created.")
        }

        def descriptor = new XmlSlurper().parse(descriptorOutputFile)
        if (descriptor.goalPrefix.text() != mavenPluginGoalPrefix) {
            throw new GradleException(
                "Expected Maven plugin goal prefix '${mavenPluginGoalPrefix}', found '${descriptor.goalPrefix.text()}'.",
            )
        }

        def goals = descriptor.mojos.mojo.collect { it.goal.text() }
        if (goals != [mavenGenerateGoal]) {
            throw new GradleException("Expected Maven plugin goals [${mavenGenerateGoal}], found ${goals}.")
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("verifyMavenPluginDescriptor"))
}

publishing {
    publications {
        named("gpr", MavenPublication) {
            artifactId = mavenPluginArtifactId
            pom.withXml {
                def root = asNode()
                if (!root.children().any { child -> child instanceof Node && child.name() == "packaging" }) {
                    root.appendNode("packaging", "maven-plugin")
                }
            }
        }
    }
}
