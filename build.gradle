import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import dev.detekt.gradle.Detekt
import dev.detekt.gradle.DetektCreateBaselineTask
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.gradle.api.file.DuplicatesStrategy

plugins {
    id 'base'
    id 'io.github.lmliam.microsmith.repository-quality'
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.kapt) apply false
    alias(libs.plugins.metro) apply false
    alias(libs.plugins.mappie) apply false
    alias(libs.plugins.detekt) apply false
    alias(libs.plugins.ktfmt) apply false
    alias(libs.plugins.axion.release)
    id 'maven-publish'
    alias(libs.plugins.kotest) apply false
    alias(libs.plugins.shadow) apply false
}

scmVersion {
    tag {
        prefix = 'v'
    }
    checks {
        snapshotDependencies.set(false)
    }
    versionCreator 'versionWithBranch'
}

group = 'io.github.lmliam.microsmith'
version = scmVersion.version

allprojects {
    group = rootProject.group
    version = rootProject.version
}

tasks.named("check") {
    dependsOn(gradle.includedBuild("build-logic").task(":test"))
}

subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'maven-publish'
    apply plugin: 'io.kotest'
    apply plugin: 'com.gradleup.shadow'
    apply plugin: 'dev.detekt'
    apply plugin: 'com.ncorti.ktfmt.gradle'

    ktfmt {
        kotlinLangStyle()
        maxWidth.set(120)
        blockIndent.set(4)
        continuationIndent.set(4)
        removeUnusedImports.set(false)
        trailingCommaManagementStrategy.set(com.ncorti.ktfmt.gradle.TrailingCommaManagementStrategy.COMPLETE)
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    def lockfiles = fileTree("${rootProject.projectDir}/gradle/dependency-locks") {
        include("*.lockfile")
    }
    if (!lockfiles.isEmpty()) {
        dependencyLocking {
            lockAllConfigurations()
        }
    } else {
        logger.lifecycle("Gradle dependency locking is enabled once lockfiles are present in gradle/dependency-locks.")
    }

    configurations.configureEach {
        resolutionStrategy {
            failOnVersionConflict()
            preferProjectModules()
        }
    }

    dependencies {
        if (project.name != 'kotest') {
            testImplementation project(':kotest')
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(24)
    }

    kotlin {
        jvmToolchain(24)
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_24)
            progressiveMode.set(true)
            freeCompilerArgs.addAll([
                '-Xjsr305=strict',
                '-Xexplicit-context-arguments',
            ])
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        reports {
            junitXml.required.set(false)
        }
        testLogging {
            events "failed", "skipped"
            exceptionFormat = TestExceptionFormat.FULL
            showCauses = true
            showStackTraces = true
        }
        systemProperty("gradle.build.dir", project.layout.buildDirectory.get().asFile)
    }

    tasks.named("build") {
        dependsOn(tasks.named("kotest"))
    }

    tasks.named("test") {
        enabled = false
    }

    plugins.withId('dev.detekt') {
        detekt {
            buildUponDefaultConfig = true
            allRules = false
            parallel = true
            ignoreFailures = false
            basePath.set(rootProject.projectDir)
            config.setFrom(files("${rootProject.projectDir}/detekt.yml"))
        }

        tasks.withType(Detekt).configureEach {
            reports {
                checkstyle.required.set(true)
                html.required.set(true)
                sarif.required.set(true)
                markdown.required.set(false)
            }
        }

        tasks.withType(DetektCreateBaselineTask).configureEach {
            enabled = false
        }
    }

    plugins.withId('tech.mappie.plugin') {
        mappie {
            useDefaultArguments.set(false)

            reporting { report ->
                report.enabled.set(true)
            }
        }
    }

    plugins.withId('io.kotest') {
        kotest {
            customGradleTask.set(true)
        }
    }

    tasks.withType(ShadowJar).configureEach {
        filesMatching("META-INF/*.kotlin_module") {
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
    }

    tasks.named("check") {
        dependsOn(tasks.named("detektMain"))
        dependsOn(tasks.named("detektTest"))
        dependsOn(tasks.named("ktfmtCheck"))
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    publishing {
        publications {
            gpr(MavenPublication) {
                from(components.java)
                groupId = project.group
                artifactId = project.name
                version = project.version
                pom {
                    name.set("microsmith-${project.name}")
                    description.set("Microsmith module '${project.name}'")
                    url.set("https://github.com/lmliam/microsmith")
                    licenses {
                        license {
                            name.set("Apache License 2.0")
                            url.set("https://www.apache.org/licenses/LICENSE-2.0")
                            distribution.set("repo")
                        }
                    }
                    scm {
                        connection.set("scm:git:git://github.com/lmliam/microsmith.git")
                        developerConnection.set("scm:git:ssh://git@github.com/lmliam/microsmith.git")
                        url.set("https://github.com/lmliam/microsmith")
                    }
                }
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/lmliam/microsmith")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

tasks.register("allJar", ShadowJar) {
    archiveBaseName.set("microsmith-all")
    archiveVersion.set(project.version.toString())
    archiveClassifier.set("all")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    subprojects.each { sub ->
        dependsOn(sub.tasks.named("jar"))
        from(sub.sourceSets.main.output)
    }
    configurations.set(subprojects.collect { it.configurations.runtimeClasspath })
    mergeServiceFiles()
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
