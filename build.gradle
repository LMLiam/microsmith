import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'base'
    id 'io.github.lmliam.microsmith.repository-quality'
    id 'org.jetbrains.kotlin.jvm' apply false
    id 'org.jetbrains.kotlin.kapt' apply false
    id 'io.gitlab.arturbosch.detekt' apply false
    id 'org.jlleitschuh.gradle.ktlint' apply false
    id 'pl.allegro.tech.build.axion-release'
    id 'maven-publish'
    id 'io.kotest' apply false
    id 'com.gradleup.shadow' apply false
}

scmVersion {
    tag {
        prefix = 'v'
    }
    checks {
        snapshotDependencies.set(false)
    }
    versionCreator 'versionWithBranch'
}

group = 'io.github.lmliam.microsmith'
version = scmVersion.version

allprojects {
    group = rootProject.group
    version = rootProject.version
}

tasks.named("check") {
    dependsOn(gradle.includedBuild("build-logic").task(":test"))
}

subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'maven-publish'
    apply plugin: 'io.kotest'
    apply plugin: 'com.gradleup.shadow'
    apply plugin: 'io.gitlab.arturbosch.detekt'
    apply plugin: 'org.jlleitschuh.gradle.ktlint'

    java {
        withSourcesJar()
        withJavadocJar()
    }

    def lockfiles = fileTree("${rootProject.projectDir}/gradle/dependency-locks") {
        include("*.lockfile")
    }
    if (!lockfiles.isEmpty()) {
        dependencyLocking {
            lockAllConfigurations()
        }
    } else {
        logger.lifecycle("Gradle dependency locking is enabled once lockfiles are present in gradle/dependency-locks.")
    }

    configurations.configureEach {
        resolutionStrategy {
            failOnVersionConflict()
            preferProjectModules()
        }
    }

    dependencies {
        if (project.name != 'kotest') {
            testImplementation project(':kotest')
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(24)
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_24
            freeCompilerArgs.add('-Xjsr305=strict')
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        reports {
            junitXml.required.set(false)
        }
        testLogging {
            events "failed", "skipped"
            exceptionFormat = TestExceptionFormat.FULL
            showCauses = true
            showStackTraces = true
        }
        systemProperty("gradle.build.dir", project.buildDir)
    }

    tasks.named("build") {
        dependsOn(tasks.named("kotest"))
    }

    tasks.named("test") {
        enabled = false
    }

    plugins.withId('io.gitlab.arturbosch.detekt') {
        detekt {
            buildUponDefaultConfig = true
            allRules = false
            parallel = true
            ignoreFailures = false
            autoCorrect = false
            basePath = rootProject.projectDir.absolutePath
            config.setFrom(files("${rootProject.projectDir}/detekt.yml"))
        }

        tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
            jvmTarget = "22" // Detekt 1.23.x currently supports parsing up to JVM 22.
            reports {
                html.required.set(true)
                xml.required.set(true)
                txt.required.set(false)
                sarif.required.set(true)
                md.required.set(false)
            }
        }

        tasks.withType(io.gitlab.arturbosch.detekt.DetektCreateBaselineTask).configureEach {
            enabled = false
        }
    }

    plugins.withId('org.jlleitschuh.gradle.ktlint') {
        ktlint {
            android = false
            ignoreFailures = false
            outputToConsole = true
            verbose = true
            filter {
                exclude("**/generated/**")
                exclude("**/build/**")
            }
        }

        tasks.matching { it.name == "ktlintGenerateBaseline" }.configureEach {
            enabled = false
        }
    }

    tasks.named("check") {
        dependsOn(tasks.named("detektMain"))
        dependsOn(tasks.named("detektTest"))
        dependsOn(tasks.named("ktlintCheck"))
    }

    kotlin {
        jvmToolchain(24)
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    publishing {
        publications {
            gpr(MavenPublication) {
                from(components.java)
                groupId = project.group
                artifactId = project.name
                version = project.version
                pom {
                    name.set("microsmith-${project.name}")
                    description.set("Microsmith module '${project.name}'")
                    url.set("https://github.com/lmliam/microsmith")
                    licenses {
                        license {
                            name.set("Apache License 2.0")
                            url.set("https://www.apache.org/licenses/LICENSE-2.0")
                            distribution.set("repo")
                        }
                    }
                    scm {
                        connection.set("scm:git:git://github.com/lmliam/microsmith.git")
                        developerConnection.set("scm:git:ssh://git@github.com/lmliam/microsmith.git")
                        url.set("https://github.com/lmliam/microsmith")
                    }
                }
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/lmliam/microsmith")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

tasks.register("allJar", ShadowJar) {
    archiveBaseName.set("microsmith-all")
    archiveVersion.set(project.version.toString())
    archiveClassifier.set("all")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    subprojects.each { sub ->
        dependsOn(sub.tasks.named("jar"))
        from(sub.sourceSets.main.output)
    }
    configurations = subprojects.collect { it.configurations.runtimeClasspath }
    mergeServiceFiles()
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
