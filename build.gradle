import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import dev.detekt.gradle.Detekt
import dev.detekt.gradle.DetektCreateBaselineTask
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.gradle.api.file.DuplicatesStrategy

plugins {
    id 'base'
    id 'io.github.lmliam.microsmith.build-tools'
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.kapt) apply false
    alias(libs.plugins.metro) apply false
    alias(libs.plugins.mappie) apply false
    alias(libs.plugins.detekt) apply false
    alias(libs.plugins.ktfmt) apply false
    alias(libs.plugins.axion.release)
    id 'maven-publish'
    alias(libs.plugins.kotest) apply false
    alias(libs.plugins.shadow) apply false
}

scmVersion {
    tag {
        prefix = 'v'
    }
    checks {
        snapshotDependencies.set(false)
    }
    versionCreator 'versionWithBranch'
}

group = 'io.github.lmliam.microsmith'
version = scmVersion.version

allprojects {
    group = rootProject.group
    version = rootProject.version
}

tasks.named("check") {
    dependsOn(gradle.includedBuild("build-logic").task(":test"))
}

def testLibraries = libs

subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'maven-publish'
    apply plugin: 'io.kotest'
    apply plugin: 'com.gradleup.shadow'
    apply plugin: 'dev.detekt'
    apply plugin: 'com.ncorti.ktfmt.gradle'

    ktfmt {
        kotlinLangStyle()
        maxWidth.set(120)
        blockIndent.set(4)
        continuationIndent.set(4)
        removeUnusedImports.set(false)
        trailingCommaManagementStrategy.set(com.ncorti.ktfmt.gradle.TrailingCommaManagementStrategy.COMPLETE)
    }

    java {
        withSourcesJar()
    }

    configurations.configureEach {
        resolutionStrategy {
            failOnVersionConflict()
            preferProjectModules()
        }
    }

    dependencies {
        testImplementation testLibraries.kotest.framework.engine
        testImplementation testLibraries.kotest.assertions.core
        testImplementation testLibraries.kotest.property
    }

    sourceSets {
        integrationTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
        e2eTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }

    configurations {
        integrationTestImplementation.extendsFrom(testImplementation)
        integrationTestRuntimeOnly.extendsFrom(testRuntimeOnly)
        e2eTestImplementation.extendsFrom(testImplementation)
        e2eTestRuntimeOnly.extendsFrom(testRuntimeOnly)
    }

    kotlin.target.compilations.named('integrationTest') {
        associateWith(kotlin.target.compilations.getByName('main'))
    }
    kotlin.target.compilations.named('e2eTest') {
        associateWith(kotlin.target.compilations.getByName('main'))
    }

    def hasIntegrationTestSources = !sourceSets.integrationTest.allSource.isEmpty()

    tasks.register('integrationTest', io.kotest.framework.gradle.tasks.KotestJvmTask) {
        description = 'Runs integration tests.'
        group = 'verification'
        mainClass.set('io.kotest.engine.launcher.MainKt')
        classpath = sourceSets.integrationTest.runtimeClasspath
        testSourceSetClasspath.set(sourceSets.integrationTest.runtimeClasspath)
        moduleName.set(project.name)
        moduleTestReportsDir.set(layout.buildDirectory.dir('test-results/integrationTest'))
        rootTestReportsDir.set(rootProject.layout.buildDirectory.dir('test-results/integrationTest'))
        inputs.files(sourceSets.integrationTest.output.classesDirs)
        onlyIf { hasIntegrationTestSources }
    }

    def hasE2eTestSources = !sourceSets.e2eTest.allSource.isEmpty()

    tasks.register('e2eTest', io.kotest.framework.gradle.tasks.KotestJvmTask) {
        description = 'Runs end-to-end tests.'
        group = 'verification'
        mainClass.set('io.kotest.engine.launcher.MainKt')
        classpath = sourceSets.e2eTest.runtimeClasspath
        testSourceSetClasspath.set(sourceSets.e2eTest.runtimeClasspath)
        moduleName.set(project.name)
        moduleTestReportsDir.set(layout.buildDirectory.dir('test-results/e2eTest'))
        rootTestReportsDir.set(rootProject.layout.buildDirectory.dir('test-results/e2eTest'))
        inputs.files(sourceSets.e2eTest.output.classesDirs)
        onlyIf { hasE2eTestSources }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(24)
    }

    kotlin {
        jvmToolchain(24)
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_24)
            progressiveMode.set(true)
            freeCompilerArgs.addAll([
                '-Xjsr305=strict',
                '-Xexplicit-context-arguments',
            ])
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        reports {
            junitXml.required.set(false)
        }
        testLogging {
            events "failed", "skipped"
            exceptionFormat = TestExceptionFormat.FULL
            showCauses = true
            showStackTraces = true
        }
    }

    tasks.named("build") {
        dependsOn(tasks.named("kotest"))
    }

    tasks.named("test") {
        enabled = false
    }

    plugins.withId('dev.detekt') {
        detekt {
            buildUponDefaultConfig = true
            allRules = false
            parallel = true
            ignoreFailures = false
            basePath.set(rootProject.projectDir)
            config.setFrom(files("${rootProject.projectDir}/detekt.yml"))
        }

        tasks.withType(Detekt).configureEach {
            reports {
                checkstyle.required.set(true)
                html.required.set(true)
                sarif.required.set(true)
                markdown.required.set(false)
            }
        }

        tasks.withType(DetektCreateBaselineTask).configureEach {
            enabled = false
        }
    }

    plugins.withId('tech.mappie.plugin') {
        mappie {
            useDefaultArguments.set(false)

            reporting { report ->
                report.enabled.set(true)
            }
        }
    }

    plugins.withId('io.kotest') {
        kotest {
            customGradleTask.set(true)
        }
    }

    tasks.withType(ShadowJar).configureEach {
        filesMatching("META-INF/*.kotlin_module") {
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
    }

    tasks.named("check") {
        dependsOn(tasks.named("detektMain"))
        dependsOn(tasks.named("detektTest"))
        dependsOn(tasks.named("detektIntegrationTest"))
        dependsOn(tasks.named("detektE2eTest"))
        dependsOn(tasks.named("ktfmtCheck"))
        dependsOn(tasks.named("integrationTest"))
        dependsOn(tasks.named("e2eTest"))
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    publishing {
        publications {
            gpr(MavenPublication) {
                from(components.java)
                groupId = project.group
                artifactId = project.name
                version = project.version
                pom {
                    name.set("microsmith-${project.name}")
                    description.set("Microsmith module '${project.name}'")
                    url.set("https://github.com/lmliam/microsmith")
                    licenses {
                        license {
                            name.set("Apache License 2.0")
                            url.set("https://www.apache.org/licenses/LICENSE-2.0")
                            distribution.set("repo")
                        }
                    }
                    scm {
                        connection.set("scm:git:git://github.com/lmliam/microsmith.git")
                        developerConnection.set("scm:git:ssh://git@github.com/lmliam/microsmith.git")
                        url.set("https://github.com/lmliam/microsmith")
                    }
                }
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/lmliam/microsmith")
                credentials {
                    username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                    password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

